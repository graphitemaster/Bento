# Roadmap

## Working

### Language

- Scalars, vectors, matrices, arrays written `[array; N]T`, `[array; ?]T`, and `[array; _]T`, tables keyed by enums, structs with includes, enums, aliases, and tuple results
- Strict typing with untyped literals, the operator precedence of Go, `**`, and `as`
- Swizzles with `0` and `1`, `.Name` selectors, and `...` spreads
- `const`, `const if`, and `const for` inside functions
- Overloading by parameters, results, enum selectors, and memory space
- Generic functions with the built-in bounds and `u32` counts, inferred from the call or given with `f::[...]`, checked once, and exported through bytecode as templates that the linker instantiates
- References with a memory space and the overlap check, and workgroup memory
- Storage images, textures, samplers, and sampled textures built from them, with cubes, `[layer; K]` layers, and multisampling
- [Bindless](bindless.html): implicit bindless handles stored in buffers in Vulkan, Direct3D 12, and OpenGL, explicit bindless heaps in Vulkan and Direct3D 12, and both mixed with bound resources in one entry point
- Vertex, fragment, and compute entry points over structs with bindings
- Checks of every attribute, of bindings that share a slot, and of constant shift amounts and indices
- Uniformity qualifiers on `if` and `for`, and derivative checks through calls and across modules
- The built-in contexts `Thread`, `WorkGroup`, `SimdGroup`, `Vertex`, and `Fragment` read through `with` clauses
- Modules, imports, `using`, exports, and `///` doc comments
- Hints with the closest name for unknown names, fields, and enumerators

### Infrastructure

- All the tools, and the library as a single header or a static library
- IR with the builder, editor, printer, and verifier
- Bytecode safe on untrusted input and linking with unresolved imports left for later
- Optimizer passes and a table of algebraic rules
- `std` as generic prototypes, two for each function
- Lowering passes each target asks for, run before code generation on IR straight from the builder
- SPIR-V for Vulkan 1.0 to 1.4 and OpenGL 4.5, GLSL 4.50 and GLSL ES 3.10, and the C target
- AIR for Metal compute, vertex, and fragment entry points with buffers, builtins, stage inputs and outputs, matrices, calls, and control flow, for macOS, iOS, tvOS, and visionOS from Metal 3, written as a `.metallib` without LLVM
- DXIL for Direct3D 12 from Shader Model 6.9 with everything AIR has, buffers of structs, texel reads and writes of textures and storage images, bindless heaps, and most of the math builtins, written as a DXBC container that passes the validator without DXC
- GPU tests that draw and compare every frame in OpenGL, Vulkan, and Direct3D 12, the last through vkd3d-proton
- Out of memory reported once and returned from every stage, tested by failing every allocation in turn
- Diagnostics in time proportional to the file, however many errors it has
- Language server with diagnostics, hover, definitions, and outlines, and packages for VS Code and Sublime Text with one TextMate grammar
- The [bug bounty](bounty.html)

## Next

- Seeded hash tables against crafted collisions
- Uniformity analysis after mem2reg for proving the rung of every value and region. Written qualifiers become checked claims unless escaped with `[[assume]]`. The qualifiers `dispatch`, `partgroup`, and `quadgroup` are added.
- Automatic barriers at points of proven uniformity, with branches split where no such point exists
- Context parameters with `context` declarations and `with` blocks, whole context values, `WorkGroup.size`, and `Vertex.draw`. Built-in values move out of stage structs into the built-in contexts.
- Generics with interfaces as constraints and length arithmetic
- Domains, tables keyed by domains, ranges, `in`, and keyed initializers

## Later

- [Uber shaders](uber.html): features, `requires` clauses, the decision DAG of variants, and specialization
- Compile-time functions with `const fn`, methods, atomic types, and `sizeof` and `alignof`
- Sampling builtins
- Bindless in Metal, and `NonUniform` decided by the uniformity analysis
- Simdgroup operations
- Task and mesh stages
- Ray tracing: ray queries first, then native SPIR-V pipelines, the software lowering for OpenGL, and the pipeline sugar last
- AIR for buffers of structs, workgroup memory, images, textures, samplers, and the math builtins
- DXIL for workgroup memory, samplers, derivatives, `discard`, and the bit and packing builtins
- LICM, sinking, unrolling, and loop fusion and fission
- Stable bytecode. Images only load into the version of Bento that wrote them, built with the same layout. The delivery format is meant to stay stable across versions and portable across machines.
- Completion and definitions into imports in the language server, and warnings alongside errors
