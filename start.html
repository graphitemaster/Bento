# Getting started

You build Bento with a C compiler and `make`. Running `make install` afterwards copies the tools to the top of the tree:

```sh
make
make install
```

If you'd rather vendor the library, it also comes as a single header in the style of stb. Run `make unified` to generate `bento.h` and include it in one C or C++ source file with `BENTO_IMPLEMENTATION` defined first:

```c
#define BENTO_IMPLEMENTATION
#include "bento.h"
```

::: note
Other build options are documented in the Makefile.
:::

## First shader

```bento hello.bento
import std;

struct Pixel {
	[[location(0)]] uv: f32x2,
}

struct Color {
	[[color(0)]] rgba: f32x4,
}

[[stage(.Fragment)]]
fn main(px: Pixel) -> Color {
	let corner = px.uv.x * px.uv.y;
	let glow = std::smooth_step(0.0, 1.0, corner);
	return { f32x4 { px.uv, glow, 1.0 } };
}
```

Compile the shader to bytecode with `bento-c` and then generate GLSL and SPIR-V from that bytecode with `bento-llc`. The `-i` path is where `bento-c` finds `std.bbc`:

```sh
bento-c -i .build/debug hello.bento
bento-llc hello.bbc -o hello.frag
bento-llc --target=spirv hello.bbc -o hello.spv
```


## Editor support

VS Code and Sublime Text both highlight Bento with the same TextMate grammar. In either editor you can add `bento-lsp` on top of it for diagnostics, hover, and go to definition. Setup is described under [editor support](toolchain.md#editor-support).
