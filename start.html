# Getting started

Bento is built with a C compiler and `make`. The tools are copied to the top of the tree by `make install`:

```sh
make
make install
```

For vendoring, the library is also a single header in the style of stb. `bento.h` is generated by `make unified` and included into one C or C++ source file with `BENTO_IMPLEMENTATION` defined first:

```c
#define BENTO_IMPLEMENTATION
#include "bento.h"
```

::: note
Other build options are documented in the Makefile.
:::

## First shader

```bento hello.bento
import std;

struct Pixel {
	[[location(0)]] uv: f32x2,
}

struct Color {
	[[color(0)]] rgba: f32x4,
}

[[stage(.Fragment)]]
fn main(px: Pixel) -> Color {
	let corner = px.uv.x * px.uv.y;
	let glow = std::smooth_step(0.0, 1.0, corner);
	return { f32x4 { px.uv, glow, 1.0 } };
}
```

The shader is compiled and then generated:

```sh
bento-c -i .build/debug hello.bento
bento-llc hello.bbc -o hello.frag
bento-llc --target=spirv hello.bbc -o hello.spv
```


## Editor support

VS Code and Sublime Text highlight Bento with one TextMate grammar. Diagnostics, hover, and go to definition from `bento-lsp` are optional in both. Setup is described under [editor support](toolchain.md#editor-support).
