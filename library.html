# Library

## Host interface

Bento builds with `-nostdinc` and for WebAssembly because it depends on nothing, not even the freestanding C headers. The library never calls `malloc` or opens a file on its own. You provide memory, files, and diagnostics through tables of callbacks.

BTOAllocator
: `alloc`, `realloc`, and `free`. Each one is given the alignment. The last two are also given the old size. A simple allocator has no bookkeeping of its own to do.
BTOFilesystem
: `open`, `close`, `query`, `read`, `write`, and `abspath`. `query` returns the size of a file, or false when the size isn't known. The filesystem is optional. The library only uses it to make source paths in diagnostics absolute.
BTOReporter
: `display` is called with each diagnostic as soon as it's reported.

There's no mutable global state anywhere. Every table in the library is a `static const`. All state lives in the context and in objects you own. Every file compiles without warnings as both C11 and C++11 under `-Wall -Wextra -pedantic`.

## Compiling at run time

Here's a complete program that compiles a source string to GLSL or SPIR-V in a buffer:

```c embed.c
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

#define BENTO_IMPLEMENTATION
#include "bento.h"

static const char SOURCE[] =
	"struct In { [[location(0)]] uv: f32x2 }\n"
	"struct Out { [[color(0)]] color: f32x4 }\n"
	"\n"
	"[[stage(.Fragment)]]\n"
	"fn main(fs: In) -> Out {\n"
	"\tlet cell = (fs.uv * 8.0) as i32x2;\n"
	"\tlet odd = (cell.x + cell.y) & 1;\n"
	"\treturn { f32x4 { ...fs.uv, odd as f32, 1.0 } };\n"
	"}\n";

static void* heap_alloc(void* udata, BTOLength size, BTOLength align) {
	(void)udata;
	return align <= 16 ? malloc(size ? size : 1) : NULL;
}

static void* heap_realloc(void* udata, void* data, BTOLength old_size,
                          BTOLength size, BTOLength align) {
	(void)udata, (void)old_size;
	return align <= 16 ? realloc(data, size ? size : 1) : NULL;
}

static void heap_free(void* udata, void* data, BTOLength size,
                      BTOLength align) {
	(void)udata, (void)size, (void)align;
	free(data);
}

static void display(void* udata, const BTODiagnostic* d) {
	const BTOString kind = bto_diagnostic_kind_name(d->kind);
	(void)udata;
	if (d->line != 0)
		fprintf(stderr, "%.*s:%u:%u: ", (int)d->file.length,
			(const char*)d->file.buffer, d->line, d->column);
	fprintf(stderr, "%.*s: %.*s\n", (int)kind.length, (const char*)kind.buffer,
		(int)d->message.length, (const char*)d->message.data);
}

int main(int argc, char** argv) {
	const char* const target = argc > 1 ? argv[1] : "GLSL";
	const BTOAllocator heap = { heap_alloc, heap_realloc, heap_free, NULL };
	const BTOSystem system = { NULL, &heap };
	const BTOReporter reporter = { display, NULL };
	BTOContext context;
	BTOParser parser;
	BTOAST ast;
	BTOIRModule module;
	BTOOptStats stats;
	BTOBufferStream out;
	BTOString code = { NULL, 0 };

	if (!bto_context_init(&context, &system, &reporter)) {
		return 1;
	}
	bto_ast_init(&ast, &context);
	bto_ir_module_init(&module, &context);
	bto_parse_init(&parser, &ast);
	bto_buffer_stream_init(&out, &heap);

	BTOGenOptions options = bto_gen_default_options();
	options.entry = BTO_STRING("main");

	BTOStatus status = bto_parse(&parser, BTO_STRING("checker.bento"),
		BTO_STRING(SOURCE), &context);
	if (status == BTO_STATUS_OK)
		status = bto_sema(&ast, NULL, 0, &module, 0, &context);
	if (status == BTO_STATUS_OK)
		status = bto_ir_verify(&module, &context);
	if (status == BTO_STATUS_OK)
		status = bto_opt(&module, BTO_OPT_ALL, &stats, &context);
	BTOString name = bto_string_make((BTOUint8*)target, strlen(target));
	if (status == BTO_STATUS_OK)
		status = bto_gen_lower(&module, bto_gen_lowering(name, &options), &context);
	if (status == BTO_STATUS_OK)
		status = bto_gen(name, &module, &options, &out.stream, &context);
	if (status == BTO_STATUS_OK)
		status = bto_buffer_stream_result(&out, &code);
	if (status == BTO_STATUS_OK)
		fwrite(code.data, 1, code.length, stdout);

	bto_buffer_stream_fini(&out);
	bto_ir_module_fini(&module);
	bto_ast_fini(&ast);
	bto_context_fini(&context);
	return status == BTO_STATUS_OK ? 0 : 1;
}
```

```sh
cc -std=c11 -Wall -Wextra -pedantic embed.c -o embed
./embed SPIRV > checker.spv
```

## Public stages

Every stage of the compiler is public.

| Stage | Entry points |
| --- | --- |
| Context | `bto_context_init`, `bto_context_fini`, `bto_acquire_scratch`, `bto_release_scratch` |
| Lexer | `bto_lex_init`, `bto_lex_next` |
| Parser | `bto_parse_init`, `bto_parse`, `bto_ast_print`, `bto_ast_find` |
| Checker | `bto_sema` to check and lower to IR, `bto_lower` for a tree checked another way |
| IR | `bto_ir_module_init`, the builder, the editor, `bto_ir_print`, `bto_ir_strip` |
| Bytecode | `bto_ir_image_write`, `bto_ir_image_read` |
| Verifier | `bto_ir_verify` |
| Linker | `bto_link` |
| Optimizer | `bto_opt`, with passes chosen by flags |
| Generators | `bto_gen` and each target separately |
| Streams | memory, file, and growing buffer streams |

Imports are modules in memory. To use a prebuilt module like `std.bbc`, you read the file yourself, load it with `bto_ir_image_read`, verify it, and pass it to `bto_sema` as an import of the shader you're compiling at run time. The standard library is never parsed or type checked again. After that, link the two with `bto_link`, then optimize and generate code as above.

## Memory

Each AST and each IR module has an arena of its own and is freed in one call. The IR has no pointers into the AST or the source. Working memory comes from scratch arenas in the context, acquired with `bto_acquire_scratch` and given back with `bto_release_scratch`. If a scratch arena was never given back, `bto_context_fini` returns false. In the program above, verifying, optimizing, and writing GLSL make no new allocations.

Running out of memory is an ordinary error, the same as any other. The first failed allocation is reported once. Every stage returns `BTO_STATUS_OOM` from then on. If every allocation of a full build is made to fail in turn, one run at a time, each run still ends cleanly without leaks.

## Threads

A context is never shared between threads, but one thread can use several contexts. Scratch memory never leaves the stage that acquired it. Nothing a stage returns refers back to its context. ASTs and IR modules don't store a context either. You can hand one to another thread along with its arena and use it there with that thread's context. Contexts on different threads can share a `BTOSystem` and a `BTOReporter`, as long as your allocator and reporter are safe to call from those threads.

## Untrusted input

No source and no bytecode can crash the library, hang it, or exhaust its memory. That matters as soon as you compile shaders you didn't write yourself.

- Parsing limits the nesting depth and the height of the tree built from long chains of operators, calls, and `else if` arms. Going past either one is an error, not a stack overflow.
- Every offset, length, and alignment in an image is checked before any of them is trusted.
- No pass or generator runs on a module until it's been verified.
- Every loop over input is bounded and every allocation is checked.

`make -C test fuzz` builds a libFuzzer harness over the lexer, the parser, the checker, and the bytecode reader. Bytecode the verifier accepts is then put through every pass, the linker, and every generator and has to pass verification again at the end. Inside the fuzzer the library runs under a fixed memory budget. Huge requests fail inside Bento.

Any input that crashes the library, hangs it, or slips past an out of memory report is worth up to $500 USD under the [bug bounty](bounty.html).

## Single header

`bento.h` is a single stb-style header generated with `make unified`. The API is declared wherever you include the header. The implementation is compiled into exactly one file, the one where you define `BENTO_IMPLEMENTATION` before the include.

::: note
Other build options are documented in the Makefile.
