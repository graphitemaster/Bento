# IR and bytecode

## Structured control flow

Control flow in the IR is structured as SPIR-V and GLSL require. There is no control flow graph and no goto. The then and else blocks of an `if` and the body of a `loop` belong to the instruction itself. Each block ends in exactly one jump: `yield` to continue after the `if`, `break` or `continue` for the surrounding loop, `return`, or `discard`. Loops are found by walking a tree rather than by computing dominators.

Values are not passed through jumps but rather merged by PHIs. PHIs after an `if` have one operand per arm. PHIs at the top of a loop have the entry value and then one operand per `continue` in edge order. PHIs after a loop have one per `break`.

```bento sum.bento
module demo;

export fn sum(n: i32, scale: f32) -> f32 {
	let total = 0.0;
	for let i = 0; i < n; i += 1 {
		if i % 2 == 0 {
			continue;
		}
		total += scale * 2.0;
	}
	return total;
}
```

```ir bento-c --opt sum.bento -o - | bento-strip - | bento-dis - -o -
module demo

fn @sum(i32, f32) -> f32 export
%bb0(%r1, %r2):
	%r26 = ilt $0, %r1
	if %r26, %bb1, %bb13
%bb1:
	loop %bb2
%bb2:
	%r22 = phi $0, %r14, %r20
	%r24 = phi $0.0, %r24, %r18
	%r31 = ishr %r22, $31
	%r32 = band %r31, $1
	%r33 = iadd %r22, %r32
	%r34 = band %r33, $-2
	%r11 = isub %r22, %r34
	%r12 = ieq %r11, $0
	if %r12, %bb3, %bb7
%bb3:
	%r14 = iadd %r22, $1
	%r27 = ilt %r14, %r1
	if %r27, %bb4, %bb5
%bb4:
	yield %bb6
%bb5:
	break %bb12, $0
%bb6:
	continue %bb2, $0
%bb7:
	yield %bb8
%bb8:
	%r17 = fmul %r2, $2.0
	%r18 = fadd %r17, %r24
	%r20 = iadd %r22, $1
	%r28 = ilt %r20, %r1
	if %r28, %bb9, %bb10
%bb9:
	yield %bb11
%bb10:
	break %bb12, $1
%bb11:
	continue %bb2, $1
%bb12:
	%r30 = phi %r24, %r18
	yield %bb14
%bb13:
	yield %bb14
%bb14:
	%r25 = phi %r30, $0.0
	return %r25
```

Nesting is flattened under labels in printed IR. `%r` is a value, `%bb` a block, `$` a literal, and `@` a function or global. Uniformity qualifiers other than `simdgroup` are printed after the opcode, as in `loop.thread`.

## Instructions and types

Every instruction, type, and printed form is listed in the [IR reference](ir-reference.html). Arithmetic is split into signed, unsigned, and float only where the bits differ. Builtins such as `min` and `abs` are opcodes that fold rather than opaque calls. Literals are operands rather than instructions and are in scope everywhere in a function.

Every opcode is pure, convergent, or impure. Passes are written against those effects rather than against opcode names. Convergent instructions such as derivatives, barriers, and simdgroup operations are never moved into or out of control flow.

Fast-math flags are set per block and apply to the instructions directly in it. The types are those of the language. Uniformity is recorded on every `if` and loop, and on every function as the scope and the stages.

Generic functions are checked once and stored in bytecode as templates. Calls are instantiated by substitution, at the end of lowering for local generics and in the linker for imported ones.

::: note
Instantiation never fails.
:::

## Building IR without source

Any program can build IR through the public builder. Failures in the builder are sticky: every later build does nothing and the status is checked once at the end. Whole modules are written out with `bento-llc --target=bto` as C that builds them again:

```c sum.c
	f = bto_ir_function_begin(b, BTO_STRING("sum"), T[2], BTO_IR_LINKAGE_EXPORT);
	f->file = 0;
	r1 = bto_ir_value(1);
	r2 = bto_ir_value(2);
	b->location = 80;
	r26 = bto_ir_build_binary(b, BTO_IR_ILT, T[3], bto_ir_build_i32(b, 0), r1);
	{
		const BTOUint32 n0 = bto_ir_build_if(b, r26, BTO_IR_SCOPE_SIMDGROUP);
		bto_ir_block_begin(b, n0 + 0);
		{
			const BTOUint32 n1 = bto_ir_build_loop(b, BTO_IR_SCOPE_SIMDGROUP);
			bto_ir_block_begin(b, n1 + 0);
			r22 = bto_ir_build_ternary(b, BTO_IR_PHI, T[1], bto_ir_build_i32(b, 0), BTO_IR_NONE, BTO_IR_NONE);
			r24 = bto_ir_build_ternary(b, BTO_IR_PHI, T[0], bto_ir_build_f32(b, 0.0), BTO_IR_NONE, BTO_IR_NONE);
			b->location = 109;
			r31 = bto_ir_build_binary(b, BTO_IR_ISHR, T[1], r22, bto_ir_build_i32(b, 31));
			r32 = bto_ir_build_binary(b, BTO_IR_BAND, T[1], r31, bto_ir_build_i32(b, 1));
			r33 = bto_ir_build_binary(b, BTO_IR_IADD, T[1], r22, r32);
			r34 = bto_ir_build_binary(b, BTO_IR_BAND, T[1], r33, bto_ir_build_i32(b, -2));
			r11 = bto_ir_build_binary(b, BTO_IR_ISUB, T[1], r22, r34);
			r12 = bto_ir_build_binary(b, BTO_IR_IEQ, T[3], r11, bto_ir_build_i32(b, 0));

```

## Verification

Bytecode is verified before any tool uses it. Passes and generators depend on what the verifier guarantees: operands defined before use, well formed control flow and types, calls allowed by the stages and uniformity of the callee, and entry point bindings allowed by the stage.

Loading an IR image must be verified to prevent out of bounds and type confusion. Every offset, alignment, and length is checked before it is trusted. Objects lie in the order they are reached and each must begin where the last one ended, so none can overlap. Nesting is limited. The image is used in place, with nothing copied. No input may crash, hang, or exhaust memory.

```text bento-val
oldver.bbc: error: not an IR image from this build of Bento
cut.bbc: error: the IR image is shorter than its header says
ptr.bbc: error: the IR image is damaged: a pointer points outside it or into another object, or blocks nest too deep
```

## Bytecode

Modules are saved to `.bbc` images as one flat block with every pointer turned into an offset and are loaded back with a single read. Images of the same module are identical byte for byte. Images can be moved together with the sources they were built from.

Bytecode is a delivery format rather than a step to throw away:

- Imports left unresolved in a link stay imports for a later link.
- Shaders compiled from source, IR built by other programs, and modules compiled offline can all be linked together.
- The file table and every location are removed with `bento-strip` without changing the generated code.

```ir bento-dis partial.bbc
import bits

fn @tint(location 0 Flat u32) -> Out [color 0] export Fragment
%bb0(%r1):
	%r2 = call @noise::hash, %r1
	%r5 = band %r2, $255
	%r6 = convert %r5
	%r7 = fdiv %r6, $255.0
	%r12 = construct %r7, %r7, %r7, $1.0
	%r13 = construct %r12
	return %r13

fn @noise::hash(u32) -> u32 internal
%bb0(%r1):
	%r4 = imul %r1, $747796405
	%r5 = iadd %r4, $2891336453
	%r6 = call @bits::fold, %r5
	return %r6

fn @bits::fold(u32) -> u32 import
```

The shader here was linked with `noise` but not with `bits`.
