# Uniformity

GPU threads run in groups that move in lockstep. Some operations only work when every thread of the group is there. Derivatives are computed from the neighboring pixels of a quad, barriers are waited on by the whole workgroup, and subgroup operations exchange values across a simdgroup. In GLSL and HLSL these rules are left to the specification. Breaking one is undefined behavior or a hang. Bento proves them during compilation.

## Ladder

Bento labels every value with how widely it's shared, from the whole dispatch down to a single thread. The labels are the rungs of a ladder:

| Rung | Same for | Values from |
| --- | --- | --- |
| `dispatch` | every thread of the draw or dispatch | literals, constants, constant buffers, read-only storage, workgroup size and count |
| `workgroup` | every thread of a workgroup | the workgroup id and anything computed from it and the rungs above |
| `simdgroup` | every thread of a simdgroup | the simdgroup id and the results of simdgroup operations |
| `partgroup` | a cluster of lanes inside a simdgroup | the results of clustered operations, sized by the cluster |
| `thread` | one thread | thread ids, the fragment coordinate, varyings, and storage written by other threads |

Derivatives need a `quadgroup`, which is just a partgroup of four. You never write the size of a partgroup in checked code. It comes from the operation that produced the value.

Computed values are only as uniform as their least uniform input. The workgroup id plus a constant is still workgroup uniform, but add a thread id to it and the result is thread varying.

## Branches

When an `if` tests a simdgroup uniform condition, every thread of a simdgroup goes the same way and the simdgroup stays together. When the condition is thread varying, the threads split up and stay apart until the end of the `if`. Everything computed inside is thread varying, even a constant chosen by one arm, because which arm ran differs from thread to thread.

Early exits spread divergence further. In divergent code, a `return` or `kill` makes the rest of the function divergent. A `break` or `continue` does the same to the rest of the loop. `demote` never makes code divergent. Threads come back together at the end of every `if` and loop.

## Requirements

Each operation that needs its threads together has a minimum rung:

| Operation | Needs |
| --- | --- |
| Derivatives and sampling with an implicit level of detail | a `quadgroup` or better, in a fragment shader |
| Simdgroup operations | a `simdgroup` or better |
| Barriers | a point in `workgroup` uniform code |
| Indices into arrays of textures and bindless handles | `dispatch` uniform, or else `NonUniform` in Vulkan and an error in OpenGL |

The requirements are checked through calls at any depth, not just in the function where the operation is written.

## Uniformity qualifiers

A plain `if` or `for` gets whatever rung Bento can prove for its condition. Writing a uniformity qualifier in front of one turns it into a claim that Bento checks:

- `workgroup if`, `simdgroup if`, `partgroup if`, and `quadgroup if` are an error when the condition can't be shown to be that widely shared.
- `thread if` is always allowed and marks the spot where the threads split up.
- `else if` arms use the qualifier of the first `if` in the chain.

```bento edges.bento
import std;

struct Material {
	tint: f32x4,
}

struct Surface {
	[[constant(0)]] material: Material,
	[[location(0)]] uv:       f32x2,
}

struct Shaded {
	[[color(0)]] color: f32x4,
}

[[stage(.Fragment)]]
fn edges(fs: Surface) -> Shaded {
	let edge = std::fwidth(fs.uv.x);
	if fs.material.tint.a > 0.5 {
		edge += std::fwidth(fs.uv.y);
	}
	thread if fs.uv.x > 0.5 {
		edge += std::dpdx(fs.uv.x);
	}
	return { f32x4 { edge, edge, edge, 1 } };
}
```

```text bento-c edges.bento
edges.bento:23:11: error: derivatives cannot be used where threads diverge and require at least quadgroup uniformity
```

The first `if` tests a constant buffer. That's dispatch uniform without any qualifier. The derivative inside it is fine. Inside the second, the pixels of a quad have split up and there are no neighbors left for the derivative. The qualifier only says so out loud. Without it, the second `if` is rejected the same way.

## Unchecked promises

Some things you know about your data can't be seen from inside the shader, like a buffer the host fills with the same value everywhere. `[[assume]]` turns a claim into a promise that Bento believes without checking:

```bento
[[assume]] quadgroup if fs.flags[tile] != 0 {
	edge += std::dpdx(fs.uv.x);
}

[[assume(8)]] partgroup if cell.mask == 0 {
	...
}
```

Promised `partgroup` claims have no operation to get a size from and give it explicitly, as in `[[assume(8)]]`. Where you can, broadcast the value across the simdgroup instead. A broadcast value is simdgroup uniform without any promise.

## Functions and modules

When Bento checks a function, it tags it with a scope and a set of stages. The scope is the least uniform place a call to it may be in. Functions with a derivative on a path that hasn't diverged yet need a quadgroup, while functions that diverge and come back together before they return can be called from anywhere. The stages are the entry stages the function can be called from. A derivative in the function, or in anything it calls, narrows them to fragment.

The tags are stored in the bytecode. Calls into an imported module are checked against the tags rather than the bodies. The IR prints them after the signature:

```ir
fn @edge(f32) -> f32 internal quadgroup for Fragment
%bb0(%r1):
	%r4 = fwidth %r1
	return %r4
```

When a call breaks a tag, the error points at the call:

```text
error: 'edge' cannot be called where threads diverge and requires at least quadgroup uniformity for the derivatives it depends on
error: 'edge' cannot be called from a '.Compute' entry point and is only allowed in fragment shaders
```

Verification and linking check the tags again. That matters when a module changes after its importers were compiled. Vertex shaders compiled against a version of `edges` without derivatives can't be linked with a newer version where `edge` has one, because they were checked against tags that are no longer true:

```text bento-link place.bbc edges.bbc std.bbc
error: 'edges' exports 'edge' for fewer stages or more uniform regions than an importer was compiled against and that importer has to be recompiled
```

## Barriers

In Bento you don't write barriers yourself. Wherever one thread writes workgroup memory that another thread reads, Bento inserts a barrier at a point where the whole workgroup is still together, and when there's no such point it splits a branch to make one. With no barriers written by hand, there's no way for one to end up in divergent code.
