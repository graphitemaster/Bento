# Targets

| Target | For | Name |
| --- | --- | --- |
| SPIR-V | Vulkan 1.0 to 1.4, and OpenGL 4.5 | `spirv` |
| AIR | Metal 3 and 4 on macOS, iOS, tvOS, and visionOS | `air` |
| GLSL 4.50, GLSL ES 3.10 | OpenGL drivers without SPIR-V | `glsl` |
| C | rebuilding a module through the library | `bto` |
| nothing | checking a module | `null` |

One entry point is generated at a time. No target can pass buffers, workgroup memory, or images to a function. Functions with such parameters are copied for every set of roots they are called with. Run-time indices into them become extra parameters of the copy.

## Bindings

Bento numbers each kind of resource on its own. Every target puts them in three groups: buffers, textures, and samplers. On Vulkan the groups are descriptor sets 0, 1, and 2, and on Metal the buffer, texture, and sampler slots. Within a group the kinds come in a fixed order and the second kind starts where the first ends:

| Bento | Vulkan | Metal | OpenGL |
| --- | --- | --- | --- |
| `constant(n)` | set 0, binding `n` | `[[buffer(n)]]` | uniform block at binding `n` |
| `storage(n)` | set 0, binding `C + n` | `[[buffer(C + n)]]` | storage block at binding `n` |
| `texture(n)` | set 1, binding `n` | `[[texture(n)]]` | `sampler2D` and the like at texture unit `n` |
| `image(n)` | set 1, binding `T + n` | `[[texture(T + n)]]` | `image2D` and the like at image unit `n` |
| `sampler(n)` | set 2, binding `n` | `[[sampler(n)]]` | an error |

On GL `texture(n)` holds sampled textures and textures, which GLSL both declares as samplers. A texture is the same sampler that only `[]` reads. A Bento `sampler` is only a sampler object, which GL binds to a texture unit and never to a shader, so no GL shader takes one.

`C` is the number of constant buffers and `T` the number of textures, one more than the highest `constant(n)` or `texture(n)` any entry point of the module takes. Both come from the whole module, so every stage of a program agrees. The host knows its own counts and finds every binding without reflection. OpenGL numbers each kind apart already and takes the numbers as written.

A module with one program numbered from 0 without gaps leaves no holes on any API. Set 2 is only needed for samplers bound apart from their textures. On Metal the buffers of a vertex descriptor take the slots after the storage buffers.

These numbers are for resources bound to an entry point. Bindless handles are 8-byte values in buffers and have no numbers.

## SPIR-V

The default SPIR-V version and the newest one allowed depend on the environment:

| `--env` | Default | Newest allowed |
| --- | --- | --- |
| `vulkan1.0` | 1.0 | 1.0 |
| `vulkan1.1` | 1.3 | 1.3 |
| `vulkan1.2` | 1.5 | 1.5 |
| `vulkan1.3` | 1.6 | 1.6 |
| `vulkan1.4` | 1.6 | 1.6 |
| `opengl4.5` | 1.0, or 1.3 for simdgroup built-ins | 1.3 |

Buffers are blocks with one member. Storage buffers are laid out with std430 and constant buffers with std140.

::: note
`b32` values in buffers are stored as `u32`.
:::

Capabilities and extensions are declared only when used. SPIR-V derivatives are 32-bit only. `f16` values are converted to `f32` for `dpdx`, `dpdy`, and `fwidth`.

```spirv spirv-dis scale.spv
               OpCapability Shader
               OpMemoryModel Logical GLSL450
               OpEntryPoint GLCompute %main "main" %gl_GlobalInvocationID
               OpExecutionMode %main LocalSize 64 1 1
               OpDecorate %_runtimearr_float ArrayStride 4
               OpDecorate %_struct_9 BufferBlock
               OpMemberDecorate %_struct_9 0 Offset 0
               OpDecorate %10 DescriptorSet 0
               OpDecorate %10 Binding 0
...
   %scale_at = OpFunction %void None %50
         %48 = OpFunctionParameter %uint
         %49 = OpFunctionParameter %float
         %51 = OpLabel
         %52 = OpAccessChain %_ptr_Uniform__runtimearr_float %10 %uint_0
         %53 = OpAccessChain %_ptr_Uniform_float %52 %48
         %54 = OpLoad %float %53
         %55 = OpFMul %float %49 %54
               OpStore %53 %55
               OpReturn
               OpFunctionEnd
```

`scale_at` has a `&storage []f32` parameter and is called for two buffers. Each call goes to a separate copy built on the variable of that buffer. The index is passed as a parameter.

### Textures and samplers

SPIR-V has one type, `OpTypeImage`, for what GL calls both textures and images. Its Sampled operand tells them apart: 1 for a texture, used with a sampler or fetched, and 2 for a storage image, read and written directly. A texture joined with a sampler is an `OpTypeSampledImage` of a Sampled 1 image.

Each kind of binding takes one kind of descriptor, in the set and at the binding given under [bindings](#bindings):

| Binding | SPIR-V | Vulkan descriptor | OpenGL |
| --- | --- | --- | --- |
| `texture(n)` of a `[sampled; N]T` | `OpTypeSampledImage` | `VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER` | a `sampler2D`, from the texture and the sampler object bound to unit `n` |
| `texture(n)` of a `[texture; N]T` | `OpTypeImage` with Sampled 1 | `VK_DESCRIPTOR_TYPE_SAMPLED_IMAGE` | the sampler type of a `[sampled; N]T`, read with `texelFetch` only |
| `sampler(n)` | `OpTypeSampler` | `VK_DESCRIPTOR_TYPE_SAMPLER` | an error |
| `image(n)` | `OpTypeImage` with Sampled 2 | `VK_DESCRIPTOR_TYPE_STORAGE_IMAGE` | an `image2D` at image unit `n` |

A `[sampled; N]T` is the form every target takes, and the same shader runs on OpenGL and Vulkan. On Vulkan the host writes the image view and the sampler into one `VkDescriptorImageInfo`, or gives the sampler as an immutable sampler of the set layout. On OpenGL it binds the texture with `glBindTextureUnit(n, texture)` and the sampler object with `glBindSampler(n, sampler)`.

```bento
struct Shade {
	[[position]] at: f32x4,
	[[texture(0)]] albedo: [sampled; 2]f32,
	[[texture(1)]] normal: [texture; 2]f32,
	[[sampler(0)]] nearest: sampler,
}

let normal = [sampled; 2]f32 { fs.normal, fs.nearest };
```

```spirv spirv-dis shade.spv
         %10 = OpTypeImage %float 2D 0 0 0 1 Unknown
         %11 = OpTypeSampledImage %10
         %12 = OpVariable %_ptr_UniformConstant_11 UniformConstant
         %14 = OpVariable %_ptr_UniformConstant_10 UniformConstant
         %16 = OpTypeSampler
         %17 = OpVariable %_ptr_UniformConstant_16 UniformConstant
```

`albedo` is a combined image sampler at binding 0 of set 1. `normal` is a sampled image at binding 1 of set 1 and `nearest` a sampler at binding 0 of set 2, written to their own descriptors and joined in the shader. Samplers need Vulkan. Textures are read without a sampler and work on both.

The operands of `%10 = OpTypeImage %float 2D 0 0 0 1 Unknown` are the texel type, 2D, not a depth image, not layered, not multisampled, Sampled 1, and no format. Each type is declared and read this way:

| Bento | Vulkan SPIR-V | OpenGL SPIR-V | GLSL |
| --- | --- | --- | --- |
| `[texture; N]T` | `OpTypeImage` with Sampled 1, read with `OpImageFetch` | `OpTypeSampledImage`, read with `OpImage` and `OpImageFetch` | `sampler2D` or `sampler2DMS`, read with `texelFetch` |
| `[sampled; N]T` | `OpTypeSampledImage`, read with `OpImage` and `OpImageFetch` | the same | `sampler2D`, read with `texelFetch` |
| `[image; N]T` | `OpTypeImage` with Sampled 2, read with `OpImageRead` and written with `OpImageWrite` | the same | `image2D`, read with `imageLoad` and written with `imageStore` |
| `sampler` | `OpTypeSampler` | an error | an error |

Only `[image; N]T` is ever Sampled 2. Textures and sampled textures are always Sampled 1, bare or inside an `OpTypeSampledImage`. OpenGL has no textures without samplers, so a texture there is declared as a sampled image and `OpImage` takes the image back out of it before the fetch.

A `[sampled; N]T` built in the shader has no variable of its own. Its texture keeps its Sampled 1 variable and its sampler its `OpTypeSampler` variable. `[]` reads the texture directly, and sampling joins the two with `OpSampledImage` where it samples.

Multisampled textures are `[texture; 2][S]T`, since sampled textures have no samples. Storage images can be multisampled too, as `[image; 2][S]T`, which needs `shaderStorageImageMultisample` on Vulkan and is an error on GLSL ES.

## AIR for Metal

AIR is the IR of Metal, close to LLVM IR, and is generated directly rather than through MSL. Of all the APIs, Metal is closest to the model of Bento. Address spaces in Metal match the memory spaces of Bento one for one: `thread`, `threadgroup`, `device`, and `constant`. In both, stage structs are plain structs with attributes on the fields and there are no globals. Bindless handles become `MTLResourceID` values in argument buffers. `trace` is lowered to the intersector of Metal.

The output is a `.metallib` ready for `newLibraryWithData:`. The bitcode inside is written by Bento itself in the format of LLVM 13. Neither LLVM nor the Metal toolchain is needed to build one.

The environment is the platform and the release it runs on, named as for `metal -target`. The release sets the versions of AIR and Metal:

| `--env` | AIR | Metal |
| --- | --- | --- |
| `macos13`, `ios16`, `tvos16` | 2.5 | 3.0 |
| `macos14`, the default, `ios17`, `tvos17`, `xros1` | 2.6 | 3.1 |
| `macos15`, `ios18`, `tvos18`, `xros2` | 2.7 | 3.2 |
| `macos26`, `ios26`, `tvos26`, `xros26` | 2.8 | 4.0 |

Simulators add `-simulator` to `ios`, `tvos`, and `xros` names. Mac Catalyst adds `-macabi` to `ios` names.

## GLSL

GLSL ES 3.10 is generated with `bento-llc --es` or with `es` set in `BTOGenOptions`.

Copies read the buffers directly.

::: note
`&thread` parameters become exact `inout` parameters.
:::

Extensions are enabled only when a feature from one is used.

::: note
Shaders with 1D images, 64-bit integers, or reads from images without a format cannot be generated as GLSL ES.
:::

A `[sampled; N]T` or a `[texture; N]T` bound with `texture(n)` becomes a `sampler2D`, or the type for its form, at binding `n`. A multisampled `[texture; 2][S]T` becomes a `sampler2DMS`. A texture is read with `texelFetch` alone. GL has no separate samplers, and every `sampler` is an error.

On GL and on GPUs without ray tracing hardware, ray tracing is lowered to software traversal of a BVH in storage buffers. The BVH builders are compute kernels written in Bento and shipped in `std`.

`light::shade` is written as `light_shade`. Names starting with `gl_` or containing `__` are reserved in GLSL. `gl_ray` is written as `glx_ray` and `a__b` as `a_x_b`. Names that clash with GLSL or with a generated name get a suffix.

## C

C generated with `--target=bto` is a function `bento_build(module, context)` that rebuilds the module through the IR builder of the library. Shaders can be embedded in a program this way without bytecode. The output doubles as an example of building IR by hand.

## Generating from code

Each target is generated by one call with the target name:

```c
BTOGenOptions options = bto_gen_default_options();
options.entry = BTO_STRING("main");
options.environment = BTO_STRING("vulkan1.3");
status = bto_gen(BTO_STRING("SPIRV"), &module, &options, &out.stream, &context);
```

Output can be written to a buffer in memory, a file, or a custom stream.
