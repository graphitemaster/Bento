# Targets

| Target | For | Name |
| --- | --- | --- |
| SPIR-V | Vulkan 1.0 to 1.4, and OpenGL 4.5 | `spirv` |
| AIR | Metal 3 and 4 on macOS, iOS, tvOS, and visionOS | `air` |
| DXIL | Direct3D 12 from Shader Model 6.9 | `dxil` |
| GLSL 4.50, GLSL ES 3.10 | OpenGL drivers without SPIR-V | `glsl` |
| C | rebuilding a module through the library | `bto` |
| nothing | checking a module | `null` |

One entry point is generated at a time. No target can pass buffers, workgroup memory, or images to a function. Lowering and linking copy functions with such parameters for every set of globals they are called with. Run-time indices into them become extra parameters of the copy. Calls stay calls in every target.

## Bindings

Every kind of resource is numbered separately in Bento from 0. Shaders generated by Bento expect the resources in three groups: buffers, textures, and samplers. Set up the bindings of each API this way:

| Bento | Vulkan | Direct3D 12 | Metal | OpenGL |
| --- | --- | --- | --- | --- |
| `constant(n)` | set 0, binding `n` | `register(bn, space0)` | `[[buffer(n)]]` | uniform block at binding `n` |
| `storage(n)` | set 0, binding `C + n` | `register(un, space0)` | `[[buffer(C + n)]]` | storage block at binding `n` |
| `texture(n)` | set 1, binding `n` | `register(tn, space1)` | `[[texture(n)]]` | a GLSL sampler at texture unit `n` |
| `image(n)` | set 1, binding `T + n` | `register(un, space1)` | `[[texture(T + n)]]` | a GLSL image at image unit `n` |
| `sampler(n)` | set 2, binding `n` | `register(sn, space2)` | `[[sampler(n)]]` | an error |

`C` is the number of constant buffers and `T` is the number of textures, counted as one more than the highest `constant(n)` and `texture(n)` used by any entry point of the module. Both are counted over the whole module because every stage of a program has to agree on them. With these two counts every binding is known without reflection. Neither count is needed in Direct3D 12 because registers are typed by the kind of view. Spaces 0, 1, and 2 are used there as sets 0, 1, and 2 are in Vulkan.

### Vulkan

Create the pipeline layout from up to four descriptor set layouts:

- Set 0 contains a `VK_DESCRIPTOR_TYPE_UNIFORM_BUFFER` at binding `n` for every `constant(n)` and a `VK_DESCRIPTOR_TYPE_STORAGE_BUFFER` at binding `C + n` for every `storage(n)`.
- Set 1 contains a `VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER` or `VK_DESCRIPTOR_TYPE_SAMPLED_IMAGE` at binding `n` for every `texture(n)` and a `VK_DESCRIPTOR_TYPE_STORAGE_IMAGE` at binding `T + n` for every `image(n)`.
- Set 2 contains a `VK_DESCRIPTOR_TYPE_SAMPLER` at binding `n` for every `sampler(n)`.
- Set 3 contains the descriptor arrays of stored handles, as described under [bindless](#bindless).

Leave set 2 out when no samplers are bound apart from their textures. Leave set 3 out when no handles are stored. Give an unused set an empty layout when a later set is used.

### Direct3D 12

Create the root signature with a descriptor table, or root descriptors, for each space:

- Space 0 contains a CBV range from `b0` for every `constant(n)` and a UAV range from `u0` for every `storage(n)`. Root CBVs and root UAVs are allowed in place of the ranges because storage buffers are raw buffers.
- Space 1 contains an SRV range from `t0` for every `texture(n)` and a UAV range from `u0` for every `image(n)`.
- Space 2 contains a sampler range from `s0` for every `sampler(n)`.

There is no combined texture and sampler in Direct3D 12. Sampled textures bound with `texture(n)` are split into the SRV at `tn` and the sampler at `sn` of space 1. Samplers are allocated in a separate descriptor heap, then bound through separate descriptor tables or as static samplers of the root signature.

Vertex attributes bound with `attribute(n)` are input elements with the semantic name `TEXCOORD` and the semantic index `n`.

### Metal

Set buffers, textures, and samplers at the indices in the table and put the buffers of a vertex descriptor after the storage buffers.

### OpenGL

Bind every resource at its own number:

| Bento | OpenGL |
| --- | --- |
| `constant(n)` | `glBindBufferBase(GL_UNIFORM_BUFFER, n, buffer)` |
| `storage(n)` | `glBindBufferBase(GL_SHADER_STORAGE_BUFFER, n, buffer)` |
| `texture(n)` | `glBindTextureUnit(n, texture)`, and `glBindSampler(n, sampler)` for a sampled texture |
| `image(n)` | `glBindImageTexture(n, texture, level, layered, layer, access, format)` |

Textures and sampled textures are both GLSL samplers at a texture unit in OpenGL. Samplers bound apart are an error.

No API has holes in its bindings when a module contains a single program and every kind is numbered from 0 without gaps. Only resources bound to an entry point are numbered this way. Bindless handles are stored in buffers and are not numbered.

## Bindless

Stored handles are 8 bytes. In Vulkan and Direct3D 12 they are indices, either into descriptor arrays and tables or into descriptor heaps. In OpenGL and Metal they are handles defined by the API.

| API | Stored handle | Sampled textures |
| --- | --- | --- |
| Vulkan, descriptor indexing | a `u32` index into the descriptor array for that kind, then zero | joined or combined |
| Vulkan, descriptor heaps | a `u32` index into the descriptor heap, then zero | joined or combined |
| Direct3D 12, descriptor tables | a `u32` index into the descriptor range for that kind, then zero | joined |
| Direct3D 12, descriptor heaps | a `u32` index into the CBV, SRV, and UAV heap or into the sampler heap, then zero | joined |
| OpenGL | the handle from `glGetTextureHandleARB`, `glGetImageHandleARB`, or `glGetTextureSamplerHandleARB` | combined |
| Metal | the `gpuResourceID` | joined |

Stored sampled textures are 16 bytes. Joined sampled textures are the stored handle of the texture followed by the stored handle of the sampler and are joined in the shader. Combined sampled textures are one stored handle for both followed by 8 bytes of zero. The handle is made on the host from a combined image sampler in Vulkan or with `glGetTextureSamplerHandleARB` in OpenGL. Samplers cannot be stored alone in OpenGL.

The descriptors behind the handles are set up as follows:

- Vulkan with descriptor indexing: the descriptor arrays are sampled images at binding 0, storage images at binding 1, samplers at binding 2, and combined image samplers at binding 3 of set 3. Create each as a runtime array with descriptor indexing.
- Vulkan with descriptor heaps: the indices are into the heaps of `VK_EXT_descriptor_heap`.
- Direct3D 12 with descriptor tables: the descriptor ranges are an unbounded SRV range from `t0`, an unbounded UAV range from `u0`, and an unbounded sampler range from `s0` of space 3.
- Direct3D 12 with descriptor heaps: the indices are into the two heaps set with `SetDescriptorHeaps`. Create the root signature with `D3D12_ROOT_SIGNATURE_FLAG_CBV_SRV_UAV_HEAP_DIRECTLY_INDEXED` and `D3D12_ROOT_SIGNATURE_FLAG_SAMPLER_HEAP_DIRECTLY_INDEXED`.
- OpenGL: make every handle resident with `glMakeTextureHandleResidentARB` or `glMakeImageHandleResidentARB` before drawing.
- Metal: create samplers with `supportArgumentBuffers` and make every texture and sampler resident with `useResource` or a residency set.

In generated code a handle in Vulkan is an index into the descriptor array or heap and is decorated `NonUniform` when it is not uniform. In Direct3D 12 the handle is made with `createHandleFromBinding` from a descriptor range or with `createHandleFromHeap` from a heap and is marked non-uniform when it is not uniform. `createHandleFromHeap` is the operation behind `ResourceDescriptorHeap` and `SamplerDescriptorHeap` in HLSL. In OpenGL the handle is converted with `ARB_bindless_texture` in GLSL and `SPV_NV_bindless_texture` in SPIR-V. Handles that are not uniform are an error in OpenGL.

## SPIR-V

The default SPIR-V version and the newest one allowed depend on the environment:

| `--env` | Default | Newest allowed |
| --- | --- | --- |
| `vulkan1.0` | 1.0 | 1.0 |
| `vulkan1.1` | 1.3 | 1.3 |
| `vulkan1.2` | 1.5 | 1.5 |
| `vulkan1.3` | 1.6 | 1.6 |
| `vulkan1.4` | 1.6 | 1.6 |
| `opengl4.5` | 1.0, or 1.3 for simdgroup built-ins | 1.3 |

Buffers are blocks with one member. Storage buffers are laid out with std430 and constant buffers with std140.

::: note
`b32` values in buffers are stored as `u32`.
:::

Capabilities and extensions are declared only when used. SPIR-V derivatives are 32-bit only. `f16` values are converted to `f32` for `dpdx`, `dpdy`, and `fwidth`.

```spirv spirv-dis scale.spv
               OpCapability Shader
               OpMemoryModel Logical GLSL450
               OpEntryPoint GLCompute %main "main" %gl_GlobalInvocationID
               OpExecutionMode %main LocalSize 64 1 1
               OpDecorate %_runtimearr_float ArrayStride 4
               OpDecorate %_struct_9 BufferBlock
               OpMemberDecorate %_struct_9 0 Offset 0
               OpDecorate %10 DescriptorSet 0
               OpDecorate %10 Binding 0
...
   %scale_at = OpFunction %void None %50
         %48 = OpFunctionParameter %uint
         %49 = OpFunctionParameter %float
         %51 = OpLabel
         %52 = OpAccessChain %_ptr_Uniform__runtimearr_float %10 %uint_0
         %53 = OpAccessChain %_ptr_Uniform_float %52 %48
         %54 = OpLoad %float %53
         %55 = OpFMul %float %49 %54
               OpStore %53 %55
               OpReturn
               OpFunctionEnd
```

`scale_at` has a `&storage []f32` parameter and is called for two buffers. Each call goes to a separate copy built on the variable of that buffer. The index is passed as a parameter.

### Textures and samplers

What OpenGL calls textures and what it calls images are the same `OpTypeImage` type in SPIR-V. The Sampled operand of the type is 1 for a texture used with a sampler or fetched and 2 for a storage image that is read and written directly. Textures combined with a sampler are an `OpTypeSampledImage` of a Sampled 1 image.

Every kind of binding is one kind of descriptor at the set and binding listed under [bindings](#bindings):

| Binding | SPIR-V | Vulkan descriptor | OpenGL |
| --- | --- | --- | --- |
| `texture(n)` of a `[sampled; N]T` | `OpTypeSampledImage` | `VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER` | a GLSL sampler, from the texture and the sampler object bound to unit `n` |
| `texture(n)` of a `[texture; N]T` | `OpTypeImage` with Sampled 1 | `VK_DESCRIPTOR_TYPE_SAMPLED_IMAGE` | the sampler type of a `[sampled; N]T`, read with `texelFetch` only |
| `sampler(n)` | `OpTypeSampler` | `VK_DESCRIPTOR_TYPE_SAMPLER` | an error |
| `image(n)` | `OpTypeImage` with Sampled 2 | `VK_DESCRIPTOR_TYPE_STORAGE_IMAGE` | a GLSL image at image unit `n` |

Sampled textures are supported on every target. In Vulkan write the image view and the sampler to one `VkDescriptorImageInfo` or make the sampler an immutable sampler of the set layout.

```bento
struct Shade {
	[[position]] at: f32x4,
	[[texture(0)]] albedo: [sampled; 2]f32,
	[[texture(1)]] normal: [texture; 2]f32,
	[[sampler(0)]] nearest: sampler,
}

let normal = [sampled; 2]f32 { fs.normal, fs.nearest };
```

```spirv spirv-dis shade.spv
         %10 = OpTypeImage %float 2D 0 0 0 1 Unknown
         %11 = OpTypeSampledImage %10
         %12 = OpVariable %_ptr_UniformConstant_11 UniformConstant
         %14 = OpVariable %_ptr_UniformConstant_10 UniformConstant
         %16 = OpTypeSampler
         %17 = OpVariable %_ptr_UniformConstant_16 UniformConstant
```

`albedo` is a combined image sampler at binding 0 of set 1. `normal` is a sampled image at binding 1 of set 1 and `nearest` is a sampler at binding 0 of set 2. Both are written to separate descriptors and combined in the shader.

The operands of `%10 = OpTypeImage %float 2D 0 0 0 1 Unknown` are the texel type, 2D, not a depth image, not layered, not multisampled, Sampled 1, and no format. Every type is declared and read as follows:

| Bento | Vulkan SPIR-V | OpenGL SPIR-V | GLSL | Metal |
| --- | --- | --- | --- | --- |
| `[texture; N]T` | `OpTypeImage` with Sampled 1, read with `OpImageFetch` | `OpTypeSampledImage`, read with `OpImage` and `OpImageFetch` | a GLSL sampler, read with `texelFetch` | a texture with `access::read`, read with `read` |
| `[sampled; N]T` | `OpTypeSampledImage`, read with `OpImage` and `OpImageFetch` | the same | a GLSL sampler, read with `texelFetch` | a texture with `access::sample` and a `sampler`, read with `read` |
| `[image; N]T` | `OpTypeImage` with Sampled 2, read with `OpImageRead` and written with `OpImageWrite` | the same | a GLSL image, read with `imageLoad` and written with `imageStore` | a texture with `access::read_write`, read with `read` and written with `write` |
| `sampler` | `OpTypeSampler` | an error | an error | `sampler` |

Only `[image; N]T` is ever Sampled 2. OpenGL has no textures without samplers. Textures are declared there as sampled images and `OpImage` is used to get the image back out before the fetch.

Sampled textures built in the shader do not get a variable. Indexing one reads from the variable of the texture. For sampling, the texture and the sampler are combined with `OpSampledImage` at every sample.

Multisampled textures are written `[texture; 2][S]T` and multisampled storage images `[image; 2][S]T`. Multisampled storage images require `shaderStorageImageMultisample` in Vulkan and are an error in GLSL ES.

## AIR for Metal

AIR is the IR of Metal, close to LLVM IR, and is generated directly rather than through MSL. Of all the APIs, Metal is closest to the model of Bento. Address spaces in Metal match the memory spaces of Bento one for one: `thread`, `threadgroup`, `device`, and `constant`. In both, stage structs are plain structs with attributes on the fields and there are no globals. Bindless handles become `MTLResourceID` values in argument buffers. `trace` is lowered to the intersector of Metal.

The output is a `.metallib` ready for `newLibraryWithData:`. The bitcode inside is written by Bento itself in the format of LLVM 13. Neither LLVM nor the Metal toolchain is needed to build one.

Float instructions carry the fast-math flags of their block as LLVM fast-math flags: `nonans` as `nnan`, `noinfs` as `ninf`, `nosignedzero` as `nsz`, `allowcontract` as `contract`, `allowreassoc` as `reassoc`, and `allowtransform` as all of `reassoc`, `contract`, and `arcp`.

The environment is the platform and the release it runs on, named as for `metal -target`. The release sets the versions of AIR and Metal:

| `--env` | AIR | Metal |
| --- | --- | --- |
| `macos13`, `ios16`, `tvos16` | 2.5 | 3.0 |
| `macos14`, the default, `ios17`, `tvos17`, `xros1` | 2.6 | 3.1 |
| `macos15`, `ios18`, `tvos18`, `xros2` | 2.7 | 3.2 |
| `macos26`, `ios26`, `tvos26`, `xros26` | 2.8 | 4.0 |

Simulators add `-simulator` to `ios`, `tvos`, and `xros` names. Mac Catalyst adds `-macabi` to `ios` names.

## DXIL for Direct3D 12

DXIL is the IR of Direct3D 12 and is generated directly rather than through HLSL. Despite the container being named DXBC, there is no Direct3D 11 bytecode inside, only LLVM 3.7 bitcode.

The output is a `.dxil` ready for `D3D12_SHADER_BYTECODE`. The container is written in full by Bento, down to the signatures and the checksum, and passes the DXIL validator. Neither DXC nor the Windows SDK is needed to build one.

The minimum is Shader Model 6.9. Bento does not scalarize vectors and this is the version of DXIL where HLSL stopped scalarizing vectors.

Storage buffers are raw buffers laid out with std430, as `RWByteAddressBuffer` is in HLSL. Constant buffers are laid out with std140 and read in rows of 16 bytes with `cbufferLoadLegacy`.

The fast-math flags of every block are written on the float instructions in it as LLVM fast-math flags: `nonans` as `nnan`, `noinfs` as `ninf`, `nosignedzero` as `nsz`, and `allowtransform` as `arcp`. `allowcontract` and `allowreassoc` are dropped because LLVM 3.7 has no flag for contraction or reassociation.

Stage inputs and outputs are elements of the input and output signatures. Compute and simdgroup built-ins are read with DXIL operations:

| Bento | DXIL |
| --- | --- |
| `position` | `SV_Position` |
| `vertex_index`, `instance_index` | `SV_VertexID`, `SV_InstanceID` |
| `front_facing` | `SV_IsFrontFace` |
| `frag_depth` | `SV_Depth` |
| `color(n)` | `SV_Target` with index `n` |
| `attribute(n)`, `location(n)` | `TEXCOORD` with index `n` |
| `global_invocation_id`, `workgroup_id` | `threadId`, `groupId` |
| `local_invocation_id`, `local_invocation_index` | `threadIdInGroup`, `flattenedThreadIdInGroup` |
| `simdgroup_lane`, `simdgroup_size` | `waveGetLaneIndex`, `waveGetLaneCount` |

Textures, images, and samplers are bound at the registers listed under [bindings](#bindings):

| Bento | Direct3D 12 | HLSL |
| --- | --- | --- |
| `[texture; N]T` | SRV, read with `textureLoad` | `Texture2D<T>` and the other forms |
| `[sampled; N]T` | SRV and a sampler at the same register in space 1 | `Texture2D<T>` and `SamplerState` |
| `[image; N]T` | UAV, read with `textureLoad` and written with `textureStore` | `RWTexture2D<T>` and the other forms |
| `sampler` | sampler | `SamplerState` |

## GLSL

GLSL ES 3.10 is generated with `bento-llc --es` or with `es` set in `BTOGenOptions`.

Copies read the buffers directly.

::: note
`&thread` parameters become exact `inout` parameters.
:::

Extensions are enabled only when a feature from one is used.

::: note
Shaders with 1D images, 64-bit integers, or reads from images without a format cannot be generated as GLSL ES.
:::

Textures and sampled textures bound with `texture(n)` are declared at binding `n` as the GLSL sampler type of the same form. `[[]texture; 2][4]u32` is declared as `usampler2DMSArray` and `[sampled; 6]f32` as `samplerCube`. Textures are read with `texelFetch` alone. Samplers are an error in OpenGL.

In OpenGL and on GPUs without ray tracing hardware, ray tracing is lowered to software traversal of a BVH in storage buffers. The BVH builders are compute kernels written in Bento and shipped in `std`.

`light::shade` is written as `light_shade`. Names starting with `gl_` or containing `__` are reserved in GLSL. `gl_ray` is written as `glx_ray` and `a__b` as `a_x_b`. Names that clash with GLSL or with a generated name get a suffix.

## C

C generated with `--target=bto` is a function `bento_build(module, context)` that rebuilds the module through the IR builder of the library. Shaders can be embedded in a program this way without bytecode. The output doubles as an example of building IR by hand.

## Generating from code

Each target is generated by one call with the target name:

```c
BTOGenOptions options = bto_gen_default_options();
options.entry = BTO_STRING("main");
options.environment = BTO_STRING("vulkan1.3");
status = bto_gen(BTO_STRING("SPIRV"), &module, &options, &out.stream, &context);
```

Output can be written to a buffer in memory, a file, or a custom stream.
