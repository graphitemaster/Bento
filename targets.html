# Targets

| Target | For | Name |
| --- | --- | --- |
| SPIR-V | Vulkan 1.0 to 1.4, and OpenGL 4.5 | `spirv` |
| AIR | Metal 3 and 4 on macOS, iOS, tvOS, and visionOS | `air` |
| DXIL | Direct3D 12 from Shader Model 6.9 | `dxil` |
| GLSL 4.50, GLSL ES 3.10 | OpenGL drivers without SPIR-V | `glsl` |
| C | rebuilding a module through the library | `bto` |
| nothing | checking a module | `null` |

Bento generates one entry point at a time. None of the targets can pass buffers, workgroup memory, or images to a function. Instead, lowering and linking copy a function with such parameters once for every set of globals it's called with. Run-time indices into them become extra parameters of the copy. Calls stay calls.

## Options

Each option is a flag of `bento-llc` and a field of `BTOGenOptions`. `bto_gen_default_options` leaves all of them unset. The target itself is `--target=NAME` on the command line and the first argument of `bto_gen` in the library, with GLSL as the default of `bento-llc`.

| Flag | Field | Targets | What it does |
| --- | --- | --- | --- |
| `--entry=NAME` | `entry` | SPIR-V, AIR, DXIL, GLSL | Picks the entry point to generate. It can be left out when the module has only one. |
| `--env=NAME` | `environment` | SPIR-V, AIR | Names where the shader runs, from the tables under [SPIR-V](#spir-v) and [AIR](#air-for-metal). SPIR-V defaults to `vulkan1.0` and AIR to `macos14`. |
| `--spirv=1.N` | `version` | SPIR-V | Writes that version of SPIR-V instead of the default of the environment. The field holds `100 + 10 * N`, such as `130` for 1.3. |
| `--es` | `es` | GLSL | Writes GLSL ES 3.10 instead of GLSL 4.50. |
| `--vk-combined-image-samplers` | `vk_combined_image_samplers` | SPIR-V for Vulkan | Makes stored sampled textures combined image samplers instead of a sampled image and a sampler joined in the shader. Each one is an index into binding 3 of set 3 followed by 8 bytes of zero, as described under [bindless](#bindless). |
| `--vk-maintenance8` | `vk_maintenance8` | SPIR-V for Vulkan | Writes a signed `%` as `OpSRem` instead of `a - b * (a / b)`. |
| `--vk-maintenance9` | `vk_maintenance9` | SPIR-V for Vulkan | Writes `bit_count` and `bitfield_reverse` of 8 and 16 bits directly instead of through 32 bits. |
| `--vk-shader-integer-dot-product` | `vk_shader_integer_dot_product` | SPIR-V for Vulkan | Writes integer `dot`, `dot4_add_i8`, and `dot4_add_u8` as `OpSDot` and `OpUDot`. Environments from `vulkan1.3` on do so without the option. |
| `--vk-shader-integer-functions2` | `vk_shader_integer_functions2` | SPIR-V for Vulkan | Writes `add_sat`, `sub_sat`, `abs_diff`, `hadd`, `rhadd`, and 32-bit `leading_zeros` and `trailing_zeros` as the instructions of `SPV_INTEL_shader_integer_functions2`. |
| `--vk-shader-trinary-minmax` | `vk_shader_trinary_minmax` | SPIR-V for Vulkan | Writes `min3`, `max3`, and `median3` as the instructions of `SPV_AMD_shader_trinary_minmax`. |
| `--vk-shader-mixed-float-dot-product` | `vk_shader_mixed_float_dot_product` | SPIR-V for Vulkan | Writes `dot2_add` as `OpFDot2MixAcc32VALVE`. |
| `--gl-demote-to-helper-invocation` | `gl_demote_to_helper_invocation` | GLSL, SPIR-V for OpenGL | Writes `demote` directly instead of emulating it, as described under [kill and demote](#kill-and-demote). |
| `--gl-integer-dot-product` | `gl_integer_dot_product` | GLSL, SPIR-V for OpenGL | Writes integer `dot`, `dot4_add_i8`, and `dot4_add_u8` with `GL_EXT_integer_dot_product`. |
| `--gl-shader-integer-functions2` | `gl_shader_integer_functions2` | GLSL, SPIR-V for OpenGL | Writes the functions of `--vk-shader-integer-functions2` with `GL_INTEL_shader_integer_functions2`. GLSL has them from 16 bits up. |
| `--gl-shader-trinary-minmax` | `gl_shader_trinary_minmax` | GLSL, SPIR-V for OpenGL | Writes `min3`, `max3`, and `median3` with `GL_AMD_shader_trinary_minmax`. GLSL has them only at 32 bits. |

Vulkan makes `OpSRem` poison when either operand is negative unless the device enables the `maintenance8` feature of `VK_KHR_maintenance8`. Only pass `--vk-maintenance8` for devices with the feature enabled. Options for one API are errors in an environment of the other: `--vk-` ones with `--env=opengl4.5` and `--gl-` ones with a Vulkan environment.

Other shading languages compile a shader once for a version of an API. Every GPU with that version then runs the same code, whatever else its driver offers. GPUs differ in more than the version they report, though. Some have saturating adds, averages, and three-way minimums as single instructions. Newer drivers lift old limits, such as bit counts that only work on 32-bit integers. The generator options name these extras, like `vk_maintenance9` or `gl_shader_integer_functions2`. Each one turns off the lowering that stands in for a missing instruction and lets the generator emit the native one. A host compiling IR on the machine it runs on fills the options in from the extensions the driver reports and gets code tuned for that GPU.

## Kill and demote

Bento emulates whichever one a target doesn't have:

| Target | `kill` | `demote` |
| --- | --- | --- |
| SPIR-V for Vulkan | `OpTerminateInvocation`, or `OpKill` before SPIR-V 1.6 | `OpDemoteToHelperInvocation` |
| SPIR-V for OpenGL | `OpKill` | emulated |
| GLSL | `discard` | emulated |
| AIR | emulated | `discard_fragment` |
| DXIL | emulated | `discard` |

Demotion in Vulkan requires the `shaderDemoteToHelperInvocation` feature, core from Vulkan 1.3.

Core OpenGL has no way to demote a thread. Threads that demote set a flag instead and run to the end of the entry point. The entry point kills them right before it returns. Writes to storage buffers and images check the flag first and are skipped when it's set. Functions that demote or write receive the flag as a parameter.

When your driver supports demotion, pass `--gl-demote-to-helper-invocation` or set `gl_demote_to_helper_invocation` in `BTOGenOptions` to use it directly. GLSL requires `GL_EXT_demote_to_helper_invocation` and SPIR-V for OpenGL requires `SPV_EXT_demote_to_helper_invocation`. Drivers don't reliably report either one.

Metal and Direct3D 12 only demote. Bento kills a thread there by demoting it and returning right away. Functions that can kill receive a flag as a parameter, and every call to one checks the flag afterward and returns too. Nothing runs after a `kill`.

## Bindings

In Bento every kind of resource is numbered on its own, starting from 0. The shaders Bento generates expect their resources in three groups: buffers, textures, and samplers. Here's how to set up the bindings in each API:

| Bento | Vulkan | Direct3D 12 | Metal | OpenGL |
| --- | --- | --- | --- | --- |
| `constant(n)` | set 0, binding `n` | `register(bn, space0)` | `[[buffer(n)]]` | uniform block at binding `n` |
| `storage(n)` | set 0, binding `C + n` | `register(un, space0)` | `[[buffer(C + n)]]` | storage block at binding `n` |
| `texture(n)` | set 1, binding `n` | `register(tn, space1)` | `[[texture(n)]]` | a GLSL sampler at texture unit `n` |
| `image(n)` | set 1, binding `T + n` | `register(un, space1)` | `[[texture(T + n)]]` | a GLSL image at image unit `n` |
| `sampler(n)` | set 2, binding `n` | `register(sn, space2)` | `[[sampler(n)]]` | an error |

`C` is the number of constant buffers and `T` is the number of textures, each counted as one more than the highest `constant(n)` or `texture(n)` used by any entry point in the module. They're counted over the whole module because every stage of a program has to agree on them. Once you know these two counts you know every binding, with no reflection needed. Direct3D 12 doesn't need either count, because its registers are typed by the kind of view. Spaces 0, 1, and 2 there do the job sets 0, 1, and 2 do in Vulkan.

### Vulkan

Create your pipeline layout from up to four descriptor set layouts:

- Set 0 contains a `VK_DESCRIPTOR_TYPE_UNIFORM_BUFFER` at binding `n` for every `constant(n)` and a `VK_DESCRIPTOR_TYPE_STORAGE_BUFFER` at binding `C + n` for every `storage(n)`.
- Set 1 contains a `VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER` or `VK_DESCRIPTOR_TYPE_SAMPLED_IMAGE` at binding `n` for every `texture(n)` and a `VK_DESCRIPTOR_TYPE_STORAGE_IMAGE` at binding `T + n` for every `image(n)`.
- Set 2 contains a `VK_DESCRIPTOR_TYPE_SAMPLER` at binding `n` for every `sampler(n)`.
- Set 3 contains the descriptor arrays of stored handles, as described under [bindless](#bindless).

You can leave set 2 out when no samplers are bound apart from their textures, and set 3 out when no handles are stored. When a set is unused but a later one isn't, give the unused set an empty layout.

### Direct3D 12

Create your root signature with a descriptor table, or root descriptors, for each space:

- Space 0 contains a CBV range from `b0` for every `constant(n)` and a UAV range from `u0` for every `storage(n)`. You can use root CBVs and root UAVs in place of the ranges, because storage buffers are raw buffers.
- Space 1 contains an SRV range from `t0` for every `texture(n)` and a UAV range from `u0` for every `image(n)`.
- Space 2 contains a sampler range from `s0` for every `sampler(n)`.

Direct3D 12 has no combined texture and sampler. A sampled texture bound with `texture(n)` is split in two, the SRV at `tn` and the sampler at `sn` of space 1. Samplers come from a separate descriptor heap. You bind them through separate descriptor tables or as static samplers of the root signature.

Vertex attributes bound with `attribute(n)` become input elements with the semantic name `TEXCOORD` and the semantic index `n`.

### Metal

Set your buffers, textures, and samplers at the indices in the table. The buffers of a vertex descriptor go after the storage buffers.

### OpenGL

In OpenGL every resource is bound at its own number:

| Bento | OpenGL |
| --- | --- |
| `constant(n)` | `glBindBufferBase(GL_UNIFORM_BUFFER, n, buffer)` |
| `storage(n)` | `glBindBufferBase(GL_SHADER_STORAGE_BUFFER, n, buffer)` |
| `texture(n)` | `glBindTextureUnit(n, texture)`, and `glBindSampler(n, sampler)` for a sampled texture |
| `image(n)` | `glBindImageTexture(n, texture, level, layered, layer, access, format)` |

In OpenGL, textures and sampled textures both end up as GLSL samplers at a texture unit. A sampler bound apart from its texture is an error.

When a module contains a single program and every kind is numbered from 0 without gaps, none of the APIs end up with holes in their bindings. This numbering only covers resources bound to an entry point. Bindless handles are stored in buffers and don't get numbers.

## Bindless

Bento has two models of bindless, *explicit bindless* and *implicit bindless*. The [bindings and bindless](bindless.html) page explains why there are two. This section covers how to set up each API for them.

### Implicit bindless

Every handle stored in a buffer is 8 bytes. What those bytes mean depends on the API:

| API | Stored handle |
| --- | --- |
| Vulkan | a `u32` index into the descriptor array for that kind, then zero |
| Direct3D 12 | a `u32` index into the descriptor range for that kind, then zero |
| OpenGL | the handle from `glGetTextureHandleARB`, `glGetImageHandleARB`, or `glGetTextureSamplerHandleARB` |
| Metal | the `gpuResourceID` |

A stored sampled texture is 16 bytes: the stored handle of the texture followed by the stored handle of the sampler. The shader joins the two. OpenGL is different. It has one handle for both from `glGetTextureSamplerHandleARB`, followed by 8 bytes of zero. A sampler can't be stored on its own there.

- Vulkan: the descriptor arrays are sampled images at binding 0, storage images at binding 1, samplers at binding 2, and combined image samplers at binding 3 of set 3. Create each as a runtime array with descriptor indexing. If you pass `bento-llc --vk-combined-image-samplers` or set `vk_combined_image_samplers` in `BTOGenOptions`, a stored sampled texture is instead an index into the combined image samplers followed by 8 bytes of zero. It can't be joined in the shader.
- Direct3D 12: the descriptor ranges are an unbounded SRV range from `t0`, an unbounded UAV range from `u0`, and an unbounded sampler range from `s0` of space 3.
- OpenGL: make every handle resident with `glMakeTextureHandleResidentARB` or `glMakeImageHandleResidentARB` before drawing.
- Metal: create samplers with `supportArgumentBuffers` and make every texture and sampler resident with `useResource` or a residency set.

In the generated code, a stored handle turns into:

- Vulkan: an index into the descriptor array for its kind, decorated `NonUniform`.
- Direct3D 12: a handle made with `createHandleFromBinding` from the range for its kind and marked non-uniform.
- OpenGL: a handle converted with `ARB_bindless_texture` in GLSL and with `SPV_NV_bindless_texture` in SPIR-V.

### Explicit bindless

A struct bound with `[[constant(n), heap]]` lives in the descriptor heap itself, and constant buffer `n` only contains the `u32` slot where it starts. A struct of resources goes in the resource heap and a struct of samplers in the sampler heap. The fields sit at consecutive slots in the order they're written, with one slot for every element of an array.

- Direct3D 12: the slots are in the heaps set with `SetDescriptorHeaps`. Create the root signature with `D3D12_ROOT_SIGNATURE_FLAG_CBV_SRV_UAV_HEAP_DIRECTLY_INDEXED` and `D3D12_ROOT_SIGNATURE_FLAG_SAMPLER_HEAP_DIRECTLY_INDEXED`, and make `bn` of space 0 a root constant. The handle is made with `createHandleFromHeap`, the operation behind `ResourceDescriptorHeap` and `SamplerDescriptorHeap` in HLSL.
- Vulkan: the slots are in the heaps of `VK_EXT_descriptor_heap`, `imageDescriptorSize` bytes apart in the resource heap and `samplerDescriptorSize` bytes apart in the sampler heap. Map binding `n` of set 0 to push data with `VkShaderDescriptorSetAndBindingMappingInfoEXT`, along with every other set and binding of the pipeline, set 3 included. Heaps need the `vulkan1.1` environment or later for SPIR-V 1.2.
- Metal 4: the slots are views of an `MTLTextureViewPool` or `MTLResourceViewPool`. Constant buffer `n` contains the pool's `baseResourceID`.

In OpenGL, in Metal before Metal 4, and in the `vulkan1.0` environment there's no heap. Bento ignores `heap` there. Constant buffer `n` contains the struct itself as implicit bindless handles, laid out by the usual rules of a constant buffer.

## SPIR-V

The SPIR-V version Bento writes by default, and the newest one it allows, depend on the environment:

| `--env` | Default | Newest allowed |
| --- | --- | --- |
| `vulkan1.0` | 1.0 | 1.0 |
| `vulkan1.1` | 1.3 | 1.3 |
| `vulkan1.2` | 1.5 | 1.5 |
| `vulkan1.3` | 1.6 | 1.6 |
| `vulkan1.4` | 1.6 | 1.6 |
| `opengl4.5` | 1.0, or 1.3 for simdgroup built-ins | 1.3 |

Every buffer is a block with a single member. Storage buffers are laid out with std430 and constant buffers with std140.

::: note
`b32` values in buffers are stored as `u32`.
:::

Capabilities and extensions are only declared when something uses them. Derivatives in SPIR-V are 32-bit only. Bento converts `f16` values to `f32` for `dpdx`, `dpdy`, and `fwidth`.

```spirv spirv-dis scale.spv
               OpCapability Shader
               OpMemoryModel Logical GLSL450
               OpEntryPoint GLCompute %main "main" %gl_GlobalInvocationID
               OpExecutionMode %main LocalSize 64 1 1
               OpDecorate %_runtimearr_float ArrayStride 4
               OpDecorate %_struct_9 BufferBlock
               OpMemberDecorate %_struct_9 0 Offset 0
               OpDecorate %10 DescriptorSet 0
               OpDecorate %10 Binding 0
...
   %scale_at = OpFunction %void None %50
         %48 = OpFunctionParameter %uint
         %49 = OpFunctionParameter %float
         %51 = OpLabel
         %52 = OpAccessChain %_ptr_Uniform__runtimearr_float %10 %uint_0
         %53 = OpAccessChain %_ptr_Uniform_float %52 %48
         %54 = OpLoad %float %53
         %55 = OpFMul %float %49 %54
               OpStore %53 %55
               OpReturn
               OpFunctionEnd
```

`scale_at` has a `&storage [array; _]f32` parameter and is called for two different buffers. Each call goes to its own copy of the function, built on the variable of that buffer. The index is passed in as an ordinary parameter.

### Textures and samplers

SPIR-V uses the same `OpTypeImage` type for what OpenGL calls textures and what it calls images. The Sampled operand tells them apart: it's 1 for a texture that's used with a sampler or fetched, and 2 for a storage image that's read and written directly. A texture combined with a sampler is an `OpTypeSampledImage` of a Sampled 1 image.

Each kind of binding is one kind of descriptor, at the set and binding listed under [bindings](#bindings):

| Binding | SPIR-V | Vulkan descriptor | OpenGL |
| --- | --- | --- | --- |
| `texture(n)` of a `[sampled; N]T` | `OpTypeSampledImage` | `VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER` | a GLSL sampler, from the texture and the sampler object bound to unit `n` |
| `texture(n)` of a `[texture; N]T` | `OpTypeImage` with Sampled 1 | `VK_DESCRIPTOR_TYPE_SAMPLED_IMAGE` | the sampler type of a `[sampled; N]T`, read with `texelFetch` only |
| `sampler(n)` | `OpTypeSampler` | `VK_DESCRIPTOR_TYPE_SAMPLER` | an error |
| `image(n)` | `OpTypeImage` with Sampled 2 | `VK_DESCRIPTOR_TYPE_STORAGE_IMAGE` | a GLSL image at image unit `n` |

Every target supports sampled textures. In Vulkan you either write the image view and the sampler to one `VkDescriptorImageInfo`, or make the sampler an immutable sampler of the set layout.

```bento
struct Shade {
	[[position]]   at:      f32x4,
	[[texture(0)]] albedo:  [sampled; 2]f32,
	[[texture(1)]] normal:  [texture; 2]f32,
	[[sampler(0)]] nearest: sampler,
}

let normal = [sampled; 2]f32 { fs.normal, fs.nearest };
```

```spirv spirv-dis shade.spv
         %10 = OpTypeImage %float 2D 0 0 0 1 Unknown
         %11 = OpTypeSampledImage %10
         %12 = OpVariable %_ptr_UniformConstant_11 UniformConstant
         %14 = OpVariable %_ptr_UniformConstant_10 UniformConstant
         %16 = OpTypeSampler
         %17 = OpVariable %_ptr_UniformConstant_16 UniformConstant
```

`albedo` is a combined image sampler at binding 0 of set 1. `normal` is a plain sampled image at binding 1 of set 1. `nearest` is a sampler at binding 0 of set 2. Those two are written to separate descriptors and combined in the shader.

The operands of `%10 = OpTypeImage %float 2D 0 0 0 1 Unknown` are, in order, the texel type, 2D, not a depth image, not layered, not multisampled, Sampled 1, and no format. Here's how every type is declared and read on each target:

| Bento | Vulkan SPIR-V | OpenGL SPIR-V | GLSL | Metal |
| --- | --- | --- | --- | --- |
| `[texture; N]T` | `OpTypeImage` with Sampled 1, read with `OpImageFetch` | `OpTypeSampledImage`, read with `OpImage` and `OpImageFetch` | a GLSL sampler, read with `texelFetch` | a texture with `access::read`, read with `read` |
| `[sampled; N]T` | `OpTypeSampledImage`, read with `OpImage` and `OpImageFetch` | the same | a GLSL sampler, read with `texelFetch` | a texture with `access::sample` and a `sampler`, read with `read` |
| `[image; N]T` | `OpTypeImage` with Sampled 2, read with `OpImageRead` and written with `OpImageWrite` | the same | a GLSL image, read with `imageLoad` and written with `imageStore` | a texture with `access::read_write`, read with `read` and written with `write` |
| `sampler` | `OpTypeSampler` | an error | an error | `sampler` |

Only `[image; N]T` is ever Sampled 2. OpenGL has no such thing as a texture without a sampler. Textures are declared there as sampled images instead. `OpImage` gets the image back out before the fetch.

A sampled texture built in the shader doesn't get a variable of its own. Indexing one reads from the variable of its texture. Sampling one combines the texture and the sampler with `OpSampledImage` at every sample.

Multisampled textures are written `[texture; 2][array; S]T` and multisampled storage images `[image; 2][array; S]T`. Multisampled storage images need `shaderStorageImageMultisample` in Vulkan and are an error in GLSL ES.

## AIR for Metal

AIR is the IR of Metal and is close to LLVM IR. Bento generates it directly rather than going through MSL. Of all the APIs, Metal is the closest to the model of Bento. Its address spaces match the memory spaces of Bento one for one: `thread`, `threadgroup`, `device`, and `constant`. In both, stage structs are plain structs with attributes on their fields. Neither has globals. Bindless handles become `MTLResourceID` values in argument buffers. `trace` is lowered to the intersector of Metal.

The output is a `.metallib` you can hand straight to `newLibraryWithData:`. Bento writes the bitcode inside it itself, in the format of LLVM 13.

The fast-math flags of a block become LLVM fast-math flags on its float instructions: `nonans` as `nnan`, `noinfs` as `ninf`, `nosignedzero` as `nsz`, `allowcontract` as `contract`, `allowreassoc` as `reassoc`, and `allowtransform` as all of `reassoc`, `contract`, and `arcp`.

The environment names the platform and the release it runs on, the same way `metal -target` does. The release decides the versions of AIR and Metal:

| `--env` | AIR | Metal |
| --- | --- | --- |
| `macos13`, `ios16`, `tvos16` | 2.5 | 3.0 |
| `macos14`, the default, `ios17`, `tvos17`, `xros1` | 2.6 | 3.1 |
| `macos15`, `ios18`, `tvos18`, `xros2` | 2.7 | 3.2 |
| `macos26`, `ios26`, `tvos26`, `xros26` | 2.8 | 4.0 |

For simulators, add `-simulator` to the `ios`, `tvos`, and `xros` names. For Mac Catalyst, add `-macabi` to the `ios` names.

## DXIL for Direct3D 12

DXIL is the IR of Direct3D 12. Bento generates it directly rather than going through HLSL. The container is still named DXBC, but there's no Direct3D 11 bytecode inside it, only LLVM 3.7 bitcode.

The output is a `.dxil` ready for `D3D12_SHADER_BYTECODE`. The container Bento writes, down to the signatures and the checksum, passes the DXIL validator. You don't need DXC or the Windows SDK to build one.

The minimum is Shader Model 6.9. Bento doesn't scalarize vectors. This is the version of DXIL where HLSL stopped scalarizing them too.

Storage buffers are raw buffers laid out with std430, like a `RWByteAddressBuffer` in HLSL. Constant buffers are laid out with std140 and read in rows of 16 bytes with `cbufferLoadLegacy`.

As in AIR, the fast-math flags of a block become LLVM fast-math flags on its float instructions: `nonans` as `nnan`, `noinfs` as `ninf`, `nosignedzero` as `nsz`, and `allowtransform` as `arcp`. `allowcontract` and `allowreassoc` are dropped, because LLVM 3.7 has no flag for contraction or reassociation.

Stage inputs and outputs become elements of the input and output signatures. Compute and simdgroup built-ins are read with DXIL operations:

| Bento | DXIL |
| --- | --- |
| `position` | `SV_Position` |
| `vertex_index`, `instance_index` | `SV_VertexID`, `SV_InstanceID` |
| `front_facing` | `SV_IsFrontFace` |
| `frag_depth` | `SV_Depth` |
| `color(n)` | `SV_Target` with index `n` |
| `color(0, 1)` | `SV_Target1` |
| `attribute(n)`, `location(n)` | `TEXCOORD` with index `n` |
| `global_invocation_id`, `workgroup_id` | `threadId`, `groupId` |
| `local_invocation_id`, `local_invocation_index` | `threadIdInGroup`, `flattenedThreadIdInGroup` |
| `simdgroup_lane`, `simdgroup_size` | `waveGetLaneIndex`, `waveGetLaneCount` |

Textures, images, and samplers are bound at the registers listed under [bindings](#bindings):

| Bento | Direct3D 12 | HLSL |
| --- | --- | --- |
| `[texture; N]T` | SRV, read with `textureLoad` | `Texture2D<T>` and the other forms |
| `[sampled; N]T` | SRV and a sampler at the same register in space 1 | `Texture2D<T>` and `SamplerState` |
| `[image; N]T` | UAV, read with `textureLoad` and written with `textureStore` | `RWTexture2D<T>` and the other forms |
| `sampler` | sampler | `SamplerState` |

Bento passes references to thread memory by copy in DXIL. Each parameter is a private global, written before the call and read back after it. References that overlap in one call don't see each other's writes.

## GLSL

Bento writes GLSL ES 3.10 instead of GLSL 4.50 when you pass `bento-llc --es` or set `es` in `BTOGenOptions`.

The copies of functions made by lowering and linking read the buffers directly.

::: note
`&thread` parameters become exact `inout` parameters.
:::

An extension is only enabled when the shader uses a feature from it.

::: note
Shaders with 1D images, 64-bit integers, or reads from images without a format can't be generated as GLSL ES.
:::

Textures and sampled textures bound with `texture(n)` are both declared at binding `n` as the GLSL sampler type of the same form. For example, `[layer; _][texture; 2][array; 4]u32` is declared as `usampler2DMSArray` and `[sampled; 6]f32` as `samplerCube`. A texture without a sampler is only ever read with `texelFetch`. Samplers are an error in OpenGL.

In OpenGL, and on GPUs without ray tracing hardware, ray tracing is lowered to a software traversal of a BVH in storage buffers. The BVH builders are compute kernels written in Bento itself and shipped in `std`.

`light::shade` is written as `light_shade`. GLSL reserves names that start with `gl_` or contain `__`. Bento renames them: `gl_ray` is written as `glx_ray` and `a__b` as `a_x_b`. Names that clash with GLSL or with a generated name get a suffix.

## C

With `--target=bto`, Bento writes C: a function `bento_build(module, context)` that rebuilds the module through the IR builder of the library. This is a way to embed shaders in a program without any bytecode. The output doubles as an example of building IR by hand.

## Generating from code

Generating any target is one call with the target name, made after the lowering passes that target asks for:

```c
BTOGenOptions options = bto_gen_default_options();
options.entry = BTO_STRING("main");
options.environment = BTO_STRING("vulkan1.3");
status = bto_gen_lower(&module, bto_gen_lowering(BTO_STRING("SPIRV"), &options), &context);
if (status == BTO_STATUS_OK)
	status = bto_gen(BTO_STRING("SPIRV"), &module, &options, &out.stream, &context);
```

Lowering passes rewrite whatever a target has no instruction for into something it does have, such as integer dot products before SPIR-V 1.6. They change the module, but the result is still valid IR. A rewrite can lean on other builtins that the target then lowers in turn. The sRGB packs, for one, become `packunorm4x8` of the encoded color, which DXIL lowers again to clamps, shifts, and masks.

The output can go to a buffer in memory, a file, or a custom stream.
