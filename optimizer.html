# Optimizer

Every pass in the optimizer is built on two facts about Bento's IR. The first is that control flow is always structured. Passes see each `if` and loop directly instead of recovering them from a graph of branches the way LLVM does. The second is that every instruction is pure, convergent, or impure. Convergent instructions such as derivatives, barriers, and simdgroup operations depend on which threads run them together and are never moved into or out of control flow or copied where they would run on a different set of threads.

## Passes

mem2reg
: Locals that are only ever loaded and stored whole are promoted to SSA values. With structured control flow, the PHIs after each `if` and at the top and exit of each loop all come from one ordered walk, without the dominance frontiers LLVM's mem2reg computes.
fold
: Constants are folded through every operator and builtin, and through `extract`, `insert`, `construct`, and loads of constant globals. A `select`, `&&`, or `||` with one side known is settled on the spot. Under `nonans`, NaN operands and results that would be NaN, like the `sqrt` of a negative number or `x % 0.0`, fold to zero. Under `nosignedzero`, `sign(-0.0)` and the `min` and `max` of zeros with different signs fold. An `if` with a known condition is replaced by the arm that runs. A loop without a `continue` or an early `break` is replaced by its body. When a `br` leads to a block with the same fast-math flags as the block before it, the two are merged.
algebra
: Rewrites come from a table of rules plus a few transforms written by hand. The fast-math flags on each block decide which of them apply.
cse
: An instruction with the same opcode and operands as an earlier one is replaced by the earlier result. Convergent instructions are only merged within a single block. Loads through a `&constant` reference count as pure. Calls are merged when the callee has no effects and reads nothing but constant memory. PHIs are never merged.
dse, rle
: Dead store and redundant load elimination share one walk over memory. A store that's overwritten before anything reads it is removed. A load of a place whose value is already known is replaced by that value. Whatever is known before an `if` is known again at the start of each arm. Nothing is forgotten across a call to a function without effects.
narrow
: When a struct or array is loaded only to read members at constant indices, the load is replaced by loads of just those members, at any depth. A load that reads almost every lane stays whole.
dce
: Dead code is found by mark and sweep, the same aggressive approach as LLVM's ADCE. Everything starts out dead until an effect needs it. Even values that only feed each other around a loop are removed. Whether a loop ends doesn't count as an effect.
inlining
: Every call is inlined, starting from the callees and working up to the callers. A body whose only `return` is its last statement is spliced in place of the call. Any other body is wrapped in a loop that runs once. Each `return` becomes a `break` out of it. A `return` inside one of the callee's own loops becomes a `break` of that loop and a flag tested after it. Functions marked `inline(false)` are never inlined. Functions marked `inline(true)` are inlined even with inlining turned off, and past the size budget up to a fixed ceiling.
ifconv
: When both arms of an `if` only compute a few values that are safe to compute either way, both arms run and `select` chooses the results, trading a branch for a little extra arithmetic. Divisions by a run-time value, conversions of a float to an integer, and reads at a run-time index are never moved out of an arm.
invert
: A loop that tests at the top becomes an `if` on the test wrapped around a loop that tests at the bottom, with the test copied in front of every `continue`. Tests with effects or convergent instructions are never copied. The `if` inherits the uniformity scope of the loop. Code hoisted out of the loop goes inside the `if`, where the body is known to run at least once.
sroa
: Structs, and arrays that are never indexed at run time, are split into one value per leaf. Types with many leaves stay whole.
licm and sinking
: Pure instructions whose operands are all defined outside a loop are hoisted out of it. Out of an inverted loop, even instructions that would be unsafe to run if the loop never ran are hoisted, since they end up inside the `if` that guards it. A pure instruction used in only one arm is sunk into that arm.
unrolling
: Loops with a trip count known after folding are unrolled completely when they're under a size limit.
loop fusion and fission
: Neighboring loops with the same trip count are joined into one. Fission splits loops apart to ease register pressure. Neither is done across a barrier.

The passes run in this order: inlining, mem2reg, SROA, loop inversion, fold and algebra, if-conversion, CSE, the memory walk, fold and algebra again, DCE, and finally load narrowing. CSE runs before the memory walk because two equal access chains only count as one pointer once they've been merged. Load narrowing runs last so that DCE has already removed the dead reads.

## Algebra

Exact rewrites always apply. The rest are only legal under a fast-math flag set on the block: `allowreassoc`, `allowcontract`, `allowtransform`, `nonans`, `noinfs`, or `nosignedzero`. These are described by data-driven search and replace patterns written in a pseudo DSL constructed of C macros:

```c
RULE(OP(BAND, IF(ONCE, BNOT, A), IF(ONCE, BNOT, B)), OP(BNOT, OP(BOR, A, B)), 0)
```

This rule rewrites `~a & ~b` to `~(a | b)` when neither `~` has another use. Commutative operators match either way around.

::: pair
```bento before
import std;
using module std;

fn ident(x: i32, y: i32) -> i32 {
	return (x + 0) * 1 + (y - y) + (x ^ x);
}

fn udiv7(x: u32) -> u32 {
	return x / 7;
}

fn sdiv4(x: i32) -> i32 {
	return x / 4;
}

fn morgan(a: u32, b: u32) -> u32 {
	return ~a & ~b;
}

fn idiom(a: f32) -> f32 {
	return sign(a) * floor(abs(a) + 0.5);
}

fn lanes(v: f32x4) -> f32x3 {
	return v.zyx.zyx;
}
```
```ir after
fn @ident(i32, i32) -> i32
%bb0(%r1, %r2):
	return %r1

fn @udiv7(u32) -> u32
%bb0(%r1):
	%r5, %r6 = umule %r1, $613566757
	%r7 = isub %r1, %r6
	%r8 = ushr %r7, $1
	%r9 = iadd %r6, %r8
	%r10 = ushr %r9, $2
	return %r10

fn @sdiv4(i32) -> i32
%bb0(%r1):
	%r5 = ishr %r1, $31
	%r6 = band %r5, $3
	%r7 = iadd %r1, %r6
	%r4 = ishr %r7, $2
	return %r4

fn @morgan(u32, u32) -> u32
%bb0(%r1, %r2):
	%r10 = bor %r1, %r2
	%r9 = bnot %r10
	return %r9

fn @idiom(f32) -> f32
%bb0(%r1):
	%r4 = fsign %r1
	%r11 = fmul %r4, $0x1p-1
	%r12 = fadd %r1, %r11
	%r9 = ftrunc %r12
	return %r9

fn @lanes(f32x4) -> f32x3
%bb0(%r1):
	%r5 = shuffle %r1, $xyz
	return %r5
```
:::

Division of a 32-bit integer by a constant turns into a multiply by a magic number and a shift, as in Hacker's Delight, and division by a power of two becomes a shift instead. Lossless conversions are dropped from a chain. On an `i16`, `(x as i32) as i64` is a single conversion. After an `if` with nothing but a `yield` in each arm, PHIs of scalars and vectors become a `select` on the condition.

Cases that GLSL or integer arithmetic leave undefined are never folded, since folding them would fix one answer at compile time where the hardware is free to give another. Those cases are a `clamp` with the low bound above the high bound, the `min` and `max` of a NaN or of zeros with different signs, `sign(-0.0)`, division by zero, and the `abs` of the most negative integer. Rewriting `!(a < b)` to `a >= b` needs `nonans`, because the two disagree when either side is NaN.

The square root of an `f16` or `f32` constant folds to the correctly rounded result. GPUs are allowed a few ulp of error in `sqrt`. A folded root can differ in the last place from one computed at run time.

With `allowcontract`, a multiply followed by an add becomes one `fma`:

```ir bento-c --math-flags=nonans,allowcontract --opt mad.bento
fn @mad(f32, f32, f32) -> f32 export
%bb0(%r1, %r2, %r3) fast(allowcontract, nonans):
	%r12 = fma %r1, %r2, %r3
	return %r12
```

The flags are saved in the bytecode. Every later tool preserves them.

## Custom passes

A pass maps a module to another module the verifier accepts. The passes and the lowering passes of the code generators all share a base in `bto_ir_pass.h`. It's made of a replace table with one entry per value, a change count, and an editor for inserting instructions without disturbing the walk.
