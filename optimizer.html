# Optimizer

Every pass depends on two facts: control flow is structured and every instruction is pure, convergent, or impure. Convergent instructions are never moved into or out of control flow or copied where they would run on a different set of threads.

## Passes

mem2reg
: Locals that are only loaded and stored whole are promoted to SSA values. The PHIs after each `if` and at the top and exit of each loop come from one ordered walk without dominance frontiers.
fold
: Constants are folded through every operator and builtin and through `extract`, `insert`, `construct`, and loads of constant globals. `select`, `&&`, and `||` with one side known are settled. `if`s with a known condition are replaced by the arm taken. Loops without a `continue` or an early `break` are replaced by the body.
algebra
: Rewrites come from a table of rules and a few transforms written by hand. Which of them apply depends on the fast-math flags of the block.
cse
: Instructions with the same opcode and operands as an earlier one are replaced by the earlier result. Convergent instructions are only merged within one block. Loads through a `&constant` reference count as pure. Calls are merged when the callee has no effects and reads only constant memory. PHIs are never merged.
dse, rle
: Dead store and redundant load elimination share one walk over memory. Stores overwritten before any read are removed. Loads of a place with a known value are replaced by that value. What is known before an `if` is known again at the start of each arm. Nothing known is lost across a call to a function without effects.
narrow
: Structs and arrays loaded only to read members at constant indices are replaced by loads of those members at any depth. Loads that read almost every lane stay whole.
dce
: Dead code is found by mark and sweep: everything is dead until an effect needs it. Even values that only feed each other around a loop are removed. Whether a loop ends does not count as an effect.
inlining
: Every callee body is copied into the callers, callees first. Bodies whose only `return` is last are spliced in place of the call. Other bodies are wrapped in a loop that runs once and each `return` becomes a `break` out of it. Returns inside a loop of the callee become a `break` of that loop and a flag tested after it.
ifconv
: When both arms of an `if` only compute a few values that are safe to compute either way, both arms are run and the results are chosen with `select`. Divisions by a run-time value, conversions of a float to an integer, and reads at a run-time index are never moved out of an arm.
sroa
: Structs, and arrays never indexed at run time, are split into one value per leaf. Types with many leaves stay whole.
licm and sinking
: Pure instructions with every operand defined outside a loop are hoisted out of it. Pure instructions used in only one arm are sunk into it.
unrolling
: Loops with a trip count known after folding are unrolled whole below a size limit.
loop fusion and fission
: Neighboring loops with the same trip count are joined. Loops are split by fission to ease register pressure. Neither is done across a barrier.

The order is inlining, mem2reg, SROA, fold and algebra, if-conversion, CSE, the memory walk, fold and algebra again, DCE, and then load narrowing. CSE comes before the memory walk. Equal access chains count as one pointer only once merged. Load narrowing comes last, after DCE has removed dead reads.

## Algebra

Exact rewrites always apply. Others are legal only under a fast-math flag set on the block: `allowreassoc`, `allowcontract`, `allowtransform`, `nonans`, `noinfs`, or `nosignedzero`. The rules are a plain table of C macros:

```c
RULE(OP(BAND, IF(ONCE, BNOT, A), IF(ONCE, BNOT, B)), OP(BNOT, OP(BOR, A, B)), 0)
```

By this rule, `~a & ~b` is rewritten to `~(a | b)` when neither `~` has another use. Commutative operators are matched either way around.

::: pair
```bento before
import std;
using module std;

fn ident(x: i32, y: i32) -> i32 {
	return (x + 0) * 1 + (y - y) + (x ^ x);
}

fn udiv7(x: u32) -> u32 {
	return x / 7;
}

fn sdiv4(x: i32) -> i32 {
	return x / 4;
}

fn morgan(a: u32, b: u32) -> u32 {
	return ~a & ~b;
}

fn idiom(a: f32) -> f32 {
	return sign(a) * floor(abs(a) + 0.5);
}

fn lanes(v: f32x4) -> f32x3 {
	return v.zyx.zyx;
}
```
```ir after
fn @ident(i32, i32) -> i32
%bb0(%r1, %r2):
	return %r1

fn @udiv7(u32) -> u32
%bb0(%r1):
	%r5, %r6 = umule %r1, $613566757
	%r7 = isub %r1, %r6
	%r8 = ushr %r7, $1
	%r9 = iadd %r6, %r8
	%r10 = ushr %r9, $2
	return %r10

fn @sdiv4(i32) -> i32
%bb0(%r1):
	%r5 = ishr %r1, $31
	%r6 = band %r5, $3
	%r7 = iadd %r1, %r6
	%r4 = ishr %r7, $2
	return %r4

fn @morgan(u32, u32) -> u32
%bb0(%r1, %r2):
	%r10 = bor %r1, %r2
	%r9 = bnot %r10
	return %r9

fn @idiom(f32) -> f32
%bb0(%r1):
	%r4 = fsign %r1
	%r11 = fmul %r4, $0x1p-1
	%r12 = fadd %r1, %r11
	%r9 = ftrunc %r12
	return %r9

fn @lanes(f32x4) -> f32x3
%bb0(%r1):
	%r5 = shuffle %r1, $xyz
	return %r5
```
:::

Division of 32-bit integers by a constant becomes a multiply by a magic number and a shift as in Hacker's Delight. For a power of two, a shift is used instead. Lossless conversions are dropped from a chain: on an `i16`, `(x as i32) as i64` is one conversion. After an `if` with nothing but a `yield` in each arm, PHIs of scalars and vectors become a `select` on the condition.

Cases left undefined by GLSL or by integer arithmetic are never folded: a `clamp` with the low bound above the high bound, the `min` and `max` of a NaN or of zeros of different signs, `sign(-0.0)`, division by zero, and the `abs` of the most negative integer. Rewriting `!(a < b)` to `a >= b` needs `nonans`.

The square root of an `f16` or `f32` constant is folded to the correctly rounded result. GPUs are allowed a few ulp of error in `sqrt`. Folded roots can differ in the last place from roots computed at run time.

With `allowcontract`, multiply-add pairs become one `fma`:

```ir bento-c --fast=nonans,allowcontract --opt mad.bento
fn @mad(f32, f32, f32) -> f32 export
%bb0(%r1, %r2, %r3) fast(allowcontract, nonans):
	%r12 = fma %r1, %r2, %r3
	return %r12
```

Flags are saved in the bytecode and preserved by every later tool.

## Custom passes

Passes map a module to a module the verifier accepts. The base shared by the passes in `bto_opt_pass.h` is a replace table with one entry per value, a change count, and an editor for inserting instructions without disturbing the walk.
