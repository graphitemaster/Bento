# Tools

bento-c
: Compiles source to bytecode and prints the syntax tree, the IR, or generated code on request.
bento-link
: Links modules together. Imports that none of the given modules export are left for a later link.
bento-opt
: Runs every pass of the optimizer and counts the changes each one makes.
bento-llc
: Generates SPIR-V, AIR, DXIL, or GLSL from a module, or C source that rebuilds the module through the library.
bento-dis
: Disassembles bytecode to IR text.
bento-val
: Validates modules and reports only the first problem in each one.
bento-strip
: Strips the file table and every location from a module.
bento-lsp
: Language server for diagnostics, hover, definitions, and outlines.

Any file can be given as `-` to read from stdin or write to stdout. Every tool prints its options with `--help` and exits with 0 on success, 1 after a reported failure, and 2 for a bad command line.

## Example with two modules

The example has two modules. The first is a library that exports a constant and two functions:

```bento tone.bento
/// Tone mapping, shared by every post pass.
module tone;

import std;

/// Rec. 709 luma weights.
export const LUMA = f32x3 { 0.2126, 0.7152, 0.0722 };

export fn luma(c: f32x3) -> f32 {
	return std::dot(c, LUMA);
}

/// Narkowicz's fit of the ACES filmic curve.
export fn aces(x: f32x3) -> f32x3 {
	let a = x * (x * 2.51 + 0.03);
	let b = x * (x * 2.43 + 0.59) + 0.14;
	return std::clamp(a / b, f32x3 { 0, 0, 0 }, f32x3 { 1, 1, 1 });
}
```

The second is a shader that imports `tone`. It has two entry points: a compute shader that grades a buffer of pixels and a fragment shader that draws in gray.

```bento post.bento
import std;
import tone;

struct Frame {
	[[storage(0)]]  pixels:   [array; _]f32x4,
	[[constant(1)]] exposure: f32,
}

[[stage(.Compute), workgroup_size(64)]]
fn grade(cs: Frame) with (t: Thread) {
	let c = cs.pixels[t.global.x];
	cs.pixels[t.global.x] = f32x4 { ...tone::aces(c.rgb * cs.exposure), c.a };
}

struct Input {
	[[location(0)]] color: f32x3,
}

struct Output {
	[[color(0)]] color: f32x4,
}

[[stage(.Fragment)]]
fn gray(fs: Input) -> Output {
	let y = std::sqrt(tone::luma(fs.color));
	return { f32x4 { y, y, y, 1.0 } };
}
```

### Compiling

Each module is compiled on its own against the bytecode of the modules it imports. `bento-c` looks for an import as `name.bbc` in the current directory or along each `-i` path.

```sh
bento-c tone.bento
bento-c post.bento
```

`bento-llc` won't generate code for a module that still has unresolved imports:

```text bento-llc post.bbc --entry=gray
post.bbc: error: 'tone::luma' is imported and cannot be called until the module that exports it is linked
```

### Linking

```sh
bento-link -o program.bbc post.bbc tone.bbc std.bbc
```

The linker prefixes names with the name of their module. Structs and enums merge by qualified name and have to match. When an export now allows fewer stages or needs more uniform regions than it did when an importer was compiled against it, that importer has to be compiled again.

### Optimizing

```sh
bento-opt program.bbc -o opt.bbc
```

The counts of changes go to stderr because stdout has to stay free for a pipe.

### Generating code

```sh
bento-llc opt.bbc --entry=grade -o grade.comp
bento-llc opt.bbc --entry=gray -o gray.frag
bento-llc opt.bbc --target=spirv --env=vulkan1.3 --entry=grade -o grade.spv
bento-llc opt.bbc --target=air --env=ios17 --entry=grade -o grade.metallib
bento-llc opt.bbc --target=dxil --entry=grade -o grade.dxil
```

::: note
No file is written when generation fails.
:::

### Checking, inspecting, and stripping

```sh
bento-val tone.bbc post.bbc program.bbc opt.bbc
bento-dis opt.bbc -o -
bento-strip opt.bbc -o ship.bbc
```

### Pipes

Running the same steps through pipes gives byte-identical output:

```sh
bento-c post.bento -o - | bento-link - tone.bbc -o - | bento-opt - -o - | bento-llc - --entry=gray
```

## Diagnostics

Bento reports every parse and type error in a file in one run and gives each one a line and column. When a name is unknown, the error hints at the qualified name of an import or at the closest name of the same kind:

```text
hint.bento:3:38: error: unknown function 'sqrt' and the name 'std::sqrt' is imported
hint.bento:4:37: error: unknown function 'std::normalise' and the closest function is 'std::normalize'
```

## Editor support

VS Code and Sublime Text share one TextMate grammar for syntax highlighting. In both editors you can add `bento-lsp` on top of it:

| Editor | Package | Language server |
| --- | --- | --- |
| VS Code | `editors/vscode` | through the extension |
| Sublime Text | `editors/sublime` | through the LSP package |

`bento-lsp` publishes the diagnostics of `bento-c` on every change. Hovering over a declaration shows its type and its `///` doc comment. The server also supports go to definition and the document outline. The README of each package describes how to set it up in that editor.

::: note
`tools/sublime.py` generates the Sublime Text package from the VS Code grammar.
:::
